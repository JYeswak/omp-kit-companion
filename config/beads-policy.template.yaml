# Shared strict .beads/policy.yaml template (MP3, Mission Protocol v0.1 P3).
# Closed is reachable only through gated edges. Measured on br 0.7.4: without
# strict + explicit transitions, open->closed and in_progress->closed bypass gates.
# Copy to a tracker's .beads/policy.yaml, then apply that tracker's deltas below.
# Delete the tracker's policy.yaml to restore br's default behavior.
workflow:
  strict: true
  statuses: [open, in_progress, in_review, rework, blocked, deferred, closed]
  transitions:
    initial: [open]
    open: [in_progress, blocked, deferred, closed]
    in_progress: [in_review, open, blocked, deferred]
    in_review: [closed, rework]
    rework: [in_progress]
    blocked: [open, in_progress]
    deferred: [open]
    closed: [open]
  status_groups:
    ready: [open, rework]
  required_fields:
    in_review: [acceptance_criteria, transition_comment]
    closed: [transition_comment]
  gates:
    "in_review -> closed":
      require_all:
        - min_reviewers: 1
    "open -> closed":
      require_all:
        - min_reviewers: 1
allow_bypass: false

# Per-session deltas (fleet trackers, 2026-10-06). The template is the shared floor:
# every status->closed edge is forbidden or has a nonempty gate; no bypass is allowed.
# - omp-kit: adds required_fields "open -> in_progress": [acceptance_criteria_present].
# - jev: adds deferred -> closed with min_reviewers: 1; also carries close_policy
#   self-close/reference checks (see the live .beads/policy.yaml).
# - uds: adds grading, draft, pinned, tombstone; open, in_review and grading -> closed
#   require uds_l3_close_support + min_reviewers; pinned returns to open/in_progress.
# - localbench: open/in_progress -> closed are forbidden; in_review -> closed requires
#   worker_report_landed + min_reviewers.
# - cfsios: uses the shared transition map; add this template's allow_bypass: false.
# Verify every live policy copy after rollout; these comments are not proof of activation.
