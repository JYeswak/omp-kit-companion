version = 1

[plan]
default = "PLAN_{mission}.md"

[targets]
plan_present = true
plan_rounds = 4
plan_last_diff = 0.05
converted_once = 1
coverage_checks = 1
polish_rounds = 6
polish_last_changed = 0.05
bead_self_contained_median_chars = 300
bead_self_contained_acceptance_present_share = 0.4
bead_self_contained_deps_per_bead = 1.0
# Initial scope tripwires; file/component breadth does not prove one-hour completion.
bead_breadth_max_files = 5
bead_breadth_max_components = 3
plan_to_code_hours = 24
# Middle of the protocol's 1-3 proposal range; repo owners can override it.
plan_ship_ratio_7d = 2.0
main_green = true

[weights]
plan_present = 1.0
plan_rounds = 1.0
plan_last_diff = 1.0
converted_once = 1.0
coverage_checks = 1.0
polish_rounds = 1.0
polish_last_changed = 1.0
bead_self_contained = 1.0
bead_breadth = 1.0
plan_to_code_hours = 1.0
plan_ship_ratio_7d = 1.0
main_green = 1.0

[ci]
mode = "hosted"
branch = "main"
# Workflow id or YAML filename/path, never its display name. The configured
# local Git branch is resolved exactly; an unpublished head without a run is UNKNOWN.
required_workflow = "ci.yml"

[fleet]
# Stock shipped config: NO fleet literals (oq1h.7). The operator's user
# config (XDG_CONFIG_HOME/omp-kit/fleet.toml) provides the fleet list;
# empty here means `planning score --fleet` reports NOT_CONFIGURED.
repos = []
