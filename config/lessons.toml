# Stock shipped config: NO fleet literals (oq1h.7).
# The fleet list lives in the operator's user config
# (XDG_CONFIG_HOME/omp-kit/fleet.toml, default ~/.config/omp-kit/fleet.toml)
# or the private overlay. With an empty fleet the kit reports NOT_CONFIGURED.
[checkins]
interval_minutes = 120

[fleet]
report_interval_seconds = 21600
repos = []

[classifier]
mode = "shadow"
endpoint = "http://127.0.0.1:8010/v1/systemone"
model = "clef-flash"
max_cpu_busy_pct = 80
timeout_ms = 10000
