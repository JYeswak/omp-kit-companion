detector_contract = "Specifications, not executable detector implementations. Base/candidate trees and repository-bound manifests/logs are read-only inputs. Missing adapters, unsupported syntax, partial traces, missing baseline or incomplete telemetry => UNKNOWN, never absent/safe/exempt. Filename matches route advisory review only. A mandatory row with UNKNOWN applicability must be surfaced for resolution, not silently skipped. Deduplicate repeated skill recommendations; preserve profiling before optimization. Proposed artifact records are not native skill outputs. No row authorizes running mutating workflows in a read-only assignment."
source_gate_contract = "External citations use existing SOURCEGATE1 fetch/quote registry and sources.py staged; an advisory research skill row does not make the separate sources gate optional. No cited skill is made mandatory solely by its own internal imperative."
consumer = "omp-kit next; path/diff matches nominate review, unsupported detectors stay UNKNOWN"
retirement = "Owning gates consume this canonical map; no automatic stewardship actions"
cli_extraction_contract = "Parse base/candidate package.json bin (string or object), pyproject.toml [project.scripts] and declared console entrypoints, Cargo [[bin]] plus default src/main.rs and src/bin targets. Go package main and shebang entries under bin/ are candidates. Binary targets can be GUI/daemons: confirm operator-facing argv/parser/dispatch or an existing captured help/capabilities contract before CLI classification. Join confirmed entrypoints to resolved parser/dispatch/output/error dependencies; missing parser, dynamic dispatch, unclassified executable or incomplete baseline is UNKNOWN. Never execute candidate binaries just to route this data. Applies in every CLI-related row; source: skill-read-evidence.md Shared extraction contract."
consumer_contract = "next implements path predicates, changed literal regex declarations, and package.json bin changes. Bin declarations nominate mandatory CLI review without certifying operator-facing classification. Other CLI reachability, timing, intent and trace predicates remain UNKNOWN. No land gate or artifact verification is implemented here."

