detector = "Read repo-bound work-order kind=performance/optimization, or recorded incident kind=slow-test/slow-command/timeout for a target inside the change. These enums are proposed normalization of existing work orders, not an existing shared schema; adapter must bind actual field/clauses and return UNKNOWN when unavailable."
