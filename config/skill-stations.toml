trigger = "A CLI installer entrypoint or its acquisition, integrity-verification, destination, shell-integration, upgrade or uninstall dependencies are added or changed."
detector = "Phase detail: installer implementation. Follow a manifest/docs-declared installer path and its sourced/called helpers; diff the resolved dependency set. install.sh naming or a curl-pipe-shell snippet produces a heuristic candidate only. Parse shell control flow where supported; dynamic source/eval or an unavailable shell parser => UNKNOWN. A README-only installer URL change is a distribution-contract candidate, not proof of installer semantics."
skills = ["installer-workmanship"]
artifact = "{\"native\": \"The target CLI's install.sh, with documented flags, post-install verification and uninstall/revert instructions.\", \"proposed\": \"Installer workmanship evidence envelope for platform, integrity, idempotence and consent results; not native.\", \"evidence\": \"I:1-80\"}"
mandatory = false
skill_source = "installer-workmanship/SKILL.md:1-80"

[[row]]
station = "Execute"
trigger = "The change modifies a registered golden/snapshot fixture, a snapshot assertion, or a producer registered to an existing approved-output fixture."
detector = "Phase detail: regression/output-contract review. Intersect D with the repository's registered fixture-to-producer/assertion mapping. Parse changed tests with the native language parser and resolve calls to the configured snapshot library. A *.snap/*.golden or golden*/snapshot* path match alone is HEURISTIC; an unregistered producer dependency is UNKNOWN, not unaffected."
skills = ["testing-golden-artifacts"]
artifact = "{\"native\": \"For the Rust insta example: snapshots/<module_path>__error_formatting.snap.new, followed by the accepted .snap; Golden Confidence Matrix classifying determinism/platform dependence/volatility/strategy.\", \"proposed_record\": \"golden-review record: fixture path, producer/assertion references, projection/scrubbing policy, changed fields, independent expected behavior, approval evidence. No native filename specified for this record.\"} Limit: A snapshot diff is not correctness proof. Do not auto-accept/regenerate goldens to obtain green; preserve error/span disagreements rather than scrub them away."
mandatory = false
skill_source = "testing-golden-artifacts/SKILL.md:1-83,85-115"

[[row]]
station = "G7"
trigger = "An existing test-design contract explicitly records that arbitrary expected outputs cannot be computed, no trusted reference is available, and at least one transformation relation with preconditions is identified."
detector = "Extract those three explicit assertions and their target-symbol references from the selected contract; require the target to be within change scope. Distinguish an absent field from an explicit negative assertion. Absence of expected-value assertions in source does NOT establish an oracle problem. Without the explicit contract, suitability is UNKNOWN."
skills = ["testing-metamorphic"]
artifact = "MR Strength Matrix with each surviving MR scored >=2.0; generated-input property tests; mutation evidence that EACH surviving MR catches at least one distinct planted bug class (no residual-mutant exception at this per-MR level). Separately, the whole suite kills >=80% of a representative mutation set OR provides a written argument that residual mutants are equivalent/unreachable. Compound MR chains where more sensitive, with justified chain length. Proposed application record links relations/preconditions, target, generator, strength, mutants and actual evidence; no mandatory native filename is named. Trusted expected-value/reference oracles displace this recommendation; a single known bug uses a targeted regression."
mandatory = false
skill_source = "testing-metamorphic/SKILL.md:1-100"

[[row]]
station = "G7"
trigger = "The selected compiler/optimizer assurance contract specifically requires typed parser/IR/execution metamorphic relations, per-rewrite obligations, or a replayable self-oracle catalog."
detector = "Read explicit assurance clauses and their symbol/catalog references; use the native parser to identify changes to the registered relation catalog, OracleKind/RelationSpec equivalents, rewrite obligations, or identified runner. Matching those names without resolving the actual registered implementation is HEURISTIC. Exclude the generic metamorphic row when this specialist contract applies, avoiding two default skill loads."
skills = ["metamorphic-property-testing"]
artifact = "{\"native\": \"JSON proof receipt with schema_version zeststream.spec_ops_math_receipt.v1; fields include skill, family, math_lever, seed_route_summary, proof_gate, fixture_refs, result and failure_class. Typed RelationSpec catalog and RunContext identity are named mechanisms; no universal catalog filename is prescribed.\", \"proposed_record\": \"Catalog-to-rewrite coverage and replay-evidence links where the native receipt needs station-specific linkage.\"} Limit: The body includes seed-refresh/publication/cron machinery that should not become an automatic requirement for ordinary metamorphic tests. Compiler self-oracles remain self-oracles, not independent reference implementations."
mandatory = false
skill_source = "metamorphic-property-testing/SKILL.md:1-42,104-145,184-315"

[[row]]
station = "Execute"
trigger = "The change touches an existing registered fuzz target/corpus, or a resolved external-input parser/deserializer/protocol boundary identified by a repository boundary map or source trace."
detector = "Phase detail: input-boundary robustness. Parse the existing fuzz configuration to map targets to resolved entry symbols; intersect D with those targets and their resolved dependency paths. For new boundaries require an explicit source-to-entry trace or declared boundary ownership. Byte/string parameter types, parser dependencies, parse/decode names and fuzz* filenames are HEURISTIC candidates only. Missing parser/trace/configuration yields UNKNOWN."
skills = ["testing-fuzzing"]
artifact = "{\"native\": \"Fuzz harness, seed/minimized corpus and minimized crash artifacts. Body examples name fuzz/corpus/my_target/minimal_valid, typical and boundary; fuzz/artifacts/my_target/crash-xxx; and a regression test reading crash-abc123.\", \"proposed_record\": \"fuzz-campaign record linking actual target/corpus paths, seed, limits, instrumentation, executions/coverage observations, crash stack fingerprint, minimized witness and regression.\"} Limit: No corpus, sanitizer, throughput or coverage result was exercised here. Fuzz success is finite evidence, not absence of vulnerabilities. Language/platform-specific instrumentation availability must remain explicit."
mandatory = false
skill_source = "testing-fuzzing/SKILL.md:1-108,282-342,434-494"

[[row]]
station = "Execute"
trigger = "An explicit repository release/hardening/audit manifest requests a multi-pass audit-fix-rescan bug hunt for identified scope."
detector = "Phase detail: explicitly authorized release/audit hardening. Parse the selected manifest's actual task/type/scope fields or cite its exact imperative clause, then bind the scope to the repository/change. A release filename, test execution, test changes, ordinary review request or scanner presence alone does NOT fire this row. Only complete examination of the selected authorization scope with no explicit request yields NO_MATCH(reason=NOT_REQUESTED); missing, unreadable or ambiguous manifest/scope yields UNKNOWN."
skills = ["multi-pass-bug-hunting"]
artifact = "{\"native\": \"pass1.jsonl, pass2.jsonl and findings.jsonl in the command examples; per-pass findings documentation; convergence evidence comprising clean final scan, passing tests, no new reread findings and no deferred items.\", \"proposed_record\": \"multi-pass-convergence record linking manifest scope, each pass's actual output, findings/dispositions, fixes, integration evidence and remaining gaps.\"} Limit: Do not trigger a whole-codebase hunt for every test run. The skill performs fixes; a read-only audit authorization does not authorize those fixes. Do not suppress uncertain findings merely to reach convergence."
mandatory = false
skill_source = "multi-pass-bug-hunting/SKILL.md:1-49,88-123,204-260"

[[row]]
station = "Execute"
trigger = "A change alters a registered existing grammar/parser seam or AST consumer: grammar selection, recovery/EOF policy, budgets, source-span conversion, incremental invalidation, AST-grep rule or consumer outcome handling."
detector = "Phase detail: parser/AST contract review. Resolve parse entry points and actual consumers using the native parser and symbol/reference map; intersect changed definitions/configuration with those registered seams. Inspect native grammar/config diffs for precedence, ordered alternatives, recovery, span units and cache policy. Filename terms such as parser/ast, a dependency name or a regex hit only nominate HEURISTIC candidates. Unsupported syntax, missing native runtime, incomplete mapping or consumer trace yields UNKNOWN."
skills = ["ast-parsing-engineering"]
artifact = "{\"native\": \"Minimal existing-seam change plus invariants/counterexamples, finite native conformance and real-consumer evidence. Bundled Python example accepts suite.json and emits a complete JSON response plus exit status; scripts/conformance.py and scripts/test_conformance.py are native tool/test names, not output files.\", \"proposed_record\": \"parser-contract record: parser/runtime/grammar/mode, source identity, complete/recovered outcome, consumed observables, span units, limits/enforcement points, witnesses, consumer result and unresolved prerequisites.\"} Limit: The bundled adapter covers finite Python AST conformance only, not arbitrary grammars, RustJSON, binding/dataflow, incremental implementation or safe execution. Recovered/budget-exhausted/unavailable analysis cannot become no-match or safe."
mandatory = false
skill_source = "ast-parsing-engineering/SKILL.md:1-72,98-168; ast-parsing-engineering/references/conformance.md:1-135"

[[row]]
station = "Execute"
trigger = "An explicit transition contract changes persisted schema/data, API/protocol format, configuration or dependency compatibility and requires staged migration, preservation or rollback."
detector = "Phase detail: transition implementation. Extract old/new versions, readers/writers, requested stage, compatibility window and rollback/preservation clauses from the selected contract; resolve linked changed implementations. A dependency-version bump or file named migrate alone is HEURISTIC and does not prove a staged migration is needed. Missing ownership/compatibility evidence yields UNKNOWN."
skills = ["migration"]
artifact = "{\"native\": \"Forward/rollback paths, reader/writer and data-shape mapping, mixed-version safety and old/new-stage verification; no output filename is named.\", \"proposed_record\": \"transition-preservation record containing requested stage, forward/rollback steps, compatibility window, retry/partial-failure behavior, preservation evidence and separate contraction authorization.\"} Limit: Do not automatically advance to destructive contraction. Use this minimal general workflow rather than loading all three migration skills for every transition."
mandatory = false
skill_source = "migration/SKILL.md:1-17"

[[row]]
station = "G3"
trigger = "A database-engine-aware change contains schema DDL, a data backfill/transformation, index/constraint changes, or migration configuration targeting an identified database."
detector = "Parse changed SQL with the declared engine/dialect and enumerate DDL and affected objects; parse ORM migration operations through their actual migration API, not text search. For application backfills require an explicit migration manifest or resolved write operation plus migration task binding. Compare before/after schema representations where available. Unsupported dynamic SQL, unresolved ORM semantics or missing engine is UNKNOWN; migrations/** path alone is HEURISTIC."
skills = ["safe-migrations"]
artifact = "{\"native\": \"Per-phase rollback SQL and validation queries; batch strategy, duration estimate and production-sized-clone validation. migration_planner.py --rollback and --json are named interfaces; the body prescribes no output filename.\", \"proposed_record\": \"database-transition record linking engine/version, objects, expand/migrate/switch/contract phase, real rollback SQL, validation SQL/results, row-volume assumptions and lock/lag considerations.\"} Limit: SQL parsing does not establish lock duration, production topology, data preservation or a tested rollback. The body's blanket rollback/zero-downtime claims are not evidence; contract explicitly says dropped data cannot be rolled back. Database-version-specific advice requires validation."
mandatory = false
skill_source = "safe-migrations/SKILL.md:1-65,117-155,174-217"

[[row]]
station = "G7"
trigger = "An explicit migration design manifest declares multi-system cutover, service/infrastructure migration, CDC, dual writes, shadow/parallel operation or progressive traffic migration."
detector = "Extract explicit source/target systems, selected mechanism and cutover/rollback obligations from the manifest, with references to changed deployment/routing/schema components. Mere presence of a feature flag, queue dependency or two databases is insufficient. Mechanism/source-target ownership absent or ambiguous yields UNKNOWN."
skills = ["migration-architect"]
artifact = "{\"native\": \"Migration plan, compatibility analysis and rollback procedures. The example CI artifact list explicitly names compatibility_report.json and migration_plan.json.\", \"proposed_record\": \"Cutover-to-evidence linkage and rollback-trigger record when not represented by those project-selected outputs.\"} Limit: The named JSON files occur in an example pipeline, not a verified universal writer contract. Do not claim bundled scripts emitted them. Avoid this broad planning workflow for a simple additive schema change."
mandatory = false
skill_source = "migration-architect/SKILL.md:1-42,185-285,411-464"

[[row]]
station = "Execute"
trigger = "The change intersects a resolved authentication/authorization, sensitive-data/payment, privileged endpoint, upload/download, query-construction or outbound-fetch security boundary."
detector = "Phase detail: focused security-sensitive change review. Start from an explicit boundary inventory or resolved framework registration/middleware/policy symbols; intersect changed definitions and resolved references with it. Native AST call/signature detection may nominate candidates, but source-to-sink facts require a real dataflow result or cited manual trace. auth/payment/api filenames alone are HEURISTIC. Incomplete parser/dataflow/trace yields UNKNOWN."
skills = ["security-review"]
artifact = "{\"native\": \"Applicable OWASP checklist decisions, documented mitigations and code-comment security decisions; security_scanner.py --json is a named output interface, not a guaranteed file.\", \"proposed_record\": \"focused-security-review record: boundary/principal/resource, applicable checks, source references, mitigation/evidence, scanner limits and unresolved deployment assumptions.\"} Limit: Checklist completion or lexical scanner silence is not taint proof, authorization proof or a clean bill of health. Prefer relevant checks rather than applying web-only requirements to every CLI/library."
mandatory = false
skill_source = "security-review/SKILL.md:1-56,184-224"

[[row]]
station = "Execute"
trigger = "An explicit repository security-audit manifest requests a full/comprehensive/end-to-end codebase audit, pen test or the skill's report artifacts."
detector = "Phase detail: full security audit. Read the selected audit manifest's actual authorization/scope/profile clauses; bind them to the target and source revision. An ordinary security-sensitive diff, generic release, focused question or test run does not authorize full mode. Ambiguous authorization remains UNKNOWN; default loading is guidance only."
skills = ["security-audit"]
artifact = "{\"native\": \"run-metadata.json, architecture.md, coverage-ledger.json, findings.json, REPORT.md, FINDINGS-DETAIL.md and NEEDS-VALIDATION.md; full findings/coverage validation and independent record verification are part of the workflow.\", \"proposed_record\": null} Limit: Execution requires the skill's OS-enforced sandbox controls; unavailable controls produce needs-validation, not host execution. Static boundary candidates are not confirmed findings. Source-external controls cannot be assumed present or absent."
mandatory = false
skill_source = "security-audit/SKILL.md:1-68,163-184"

[[row]]
station = "Execute"
trigger = "An explicit adoption/activation manifest selects externally sourced skill markdown or MCP configuration for installation or activation."
detector = "Phase detail: external capability adoption. Extract selected paths and external-origin evidence from the adoption manifest; match those exact bytes/digests to the candidate files. SKILL.md or .mcp.json filename alone does not establish external provenance or intended activation. Missing provenance/adoption intent yields UNKNOWN."
skills = ["ripwire-security-scan"]
artifact = "{\"native\": \"Skill scan stdout with severity, file:line, rule and offending text plus exit 0/1/2; per-MCP-server CLEAN/WARN/CRITICAL manual decision and offending stanza. No native report filename.\", \"proposed_record\": \"capability-adoption-review record linking source digest/origin, selected file/server entry, scanner/manual evidence, limitations and install decision.\"} Limit: The markdown scanner does not implement MCP semantic analysis. MCP command/args/env review remains manual; shell-like characters in an argv string are not by themselves proof that a shell executes them. Scanner-clean does not establish safety."
mandatory = false
skill_source = "ripwire-security-scan/SKILL.md:1-52,78-156"

[[row]]
station = "Execute"
trigger = "A requested structural security triage targets a declared untrusted-input entry point or changed risky sink/buffer operation."
detector = "Phase detail: structural triage, not vulnerability certification. Resolve the entry symbol and sink call sites; enumerate forward callees with a recorded hop bound, lint risky constructs in reach and inspect untested seams. Preserve grep-in=any, graph limits, counts_floor, root capped and per-rule shown_rows/rows_capped. Unresolved dynamic dispatch, missing native parser/index, capped results or absent source trace remains UNKNOWN/incomplete."
skills = ["ripwire-security-scan"]
artifact = "{\"native\": \"Ranked concerns listing sink call sites, entry-point forward reach, risky-construct hits and untested seams, explicitly labeled structural triage, not a taint proof.\", \"proposed_record\": \"structural-security-triage record preserving exact query scope, bounds, truncation/floor flags, locator evidence and required manual/dataflow follow-through.\"} Limit: Ripwire explicitly has no dataflow/taint engine. Call-graph reach does not show which values flow, sanitizer effectiveness or exploitability. Empty results from incomplete coverage cannot mean safe."
mandatory = false
skill_source = "ripwire-security-scan/SKILL.md:1-52,78-156"

[[row]]
station = "Execute"
trigger = "migration-file-added"
detector = "Added path beneath the migration directories declared by the repo migration tool config; default broad advisory candidates: migrations/, db/migrations/, supabase/migrations/ with .sql/.py/.ts suffix. This exact path fact does not prove DDL semantics; unresolved dialect/ORM analysis is UNKNOWN."
skills = ["safe-migrations"]
artifact = "Database transition plan and validation/rollback queries where applicable; explicitly disposition non-database migrations as not-applicable with reason. Proposed application record binds engine and touched objects."
mandatory = false
skill_source = "safe-migrations/SKILL.md:1-65,117-155,174-217"

