name: Stock extension negative control

# Deliberate red control, separate from ordinary source qualification on main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-extension-negative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  callback-assertion-must-fail:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Intentionally fail the actual callback test under stock isolation
        run: bun scripts/test-stock-extensions.ts --plant-assertion
