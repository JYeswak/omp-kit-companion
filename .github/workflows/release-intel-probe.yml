name: Intel release probe

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Completed canonical qualification run to probe without gating publication
        required: true
        type: string
      candidate_run_attempt:
        description: Exact native qualification attempt
        required: true
        type: string
  workflow_run:
    workflows: ["Unpublished release candidate"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  resolve-candidate:
    if: ${{ github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rehearse '))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      version: ${{ steps.candidate.outputs.version }}
      has_probe: ${{ steps.candidate.outputs.has_probe }}
      producer_attempt: ${{ steps.candidate.outputs.producer_attempt }}
      run_id: ${{ steps.producer.outputs.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the native producer without trusting caller source or version
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id || github.event.workflow_run.id }}
          ATTEMPT: ${{ inputs.candidate_run_attempt || github.event.workflow_run.run_attempt }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > producer-run.json
          if [[ -z "$EVENT_SHA" ]]; then
            EVENT_SHA="$(jq -er .head_sha producer-run.json)"
          fi
          printf 'run_id=%s\nattempt=%s\nevent_sha=%s\n' \
            "$RUN_ID" "$ATTEMPT" "$EVENT_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unpublished-candidate-index-attempt-${{ steps.producer.outputs.attempt }}
          path: candidate-index/
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Bind the probe to the completed candidate and check for Intel assets
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.producer.outputs.run_id }}
          EVENT_SHA: ${{ steps.producer.outputs.event_sha }}
          EVENT_ATTEMPT: ${{ steps.producer.outputs.attempt }}
        run: |
          set -euo pipefail
          proof=candidate-index/candidate-proof.json
          source_sha="$(jq -er '.source_sha' "$proof")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > producer-run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            | jq '{artifacts: [.[].artifacts[]]}' > producer-artifacts.json
          git show "$source_sha:scripts/omp-compat.json" > omp-config.json
          # Workflow execution H and selected source Q are different identities.
          # The native event/attempt plus the bound proof choose Q; no Q == H assumption.
          python3 scripts/release_reuse.py probe-source --repository "$GITHUB_REPOSITORY" \
            --event-run-id "$RUN_ID" --event-sha "$EVENT_SHA" --event-attempt "$EVENT_ATTEMPT" \
            --run producer-run.json --artifacts producer-artifacts.json \
            --proof "$proof" --index candidate-index/release-index.json --omp-config omp-config.json >> "$GITHUB_OUTPUT"

  intel-probe:
    needs: resolve-candidate
    if: ${{ github.event.repository.private == false && needs['resolve-candidate'].outputs.has_probe == 'true' }}
    continue-on-error: true
    runs-on: macos-15-intel
    timeout-minutes: 40
    strategy:
      # B7 rz5.30.2: serialize the OMP tracks on the Intel label. Both tracks
      # ran concurrently and the regex-budget live-stream gate (500ms ceiling)
      # refused both under load (run 39199001547: load1 5.5-13, certified
      # missed at 519.5ms). Serializing removes the harness's own
      # self-interference; thresholds and continue-on-error are unchanged.
      max-parallel: 1
      fail-fast: false
      matrix:
        track: [minimum, certified]
    env:
      CANDIDATE_VERSION: ${{ needs['resolve-candidate'].outputs.version }}
      SOURCE_SHA: ${{ needs['resolve-candidate'].outputs.source_sha }}
      TARGET: darwin-x64-none
      OMP_TRACK: ${{ matrix.track }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs['resolve-candidate'].outputs.source_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Resolve the OMP ${{ matrix.track }} version from scripts/omp-compat.json
        run: echo "OMP_VERSION=$(jq -er ".$OMP_TRACK" scripts/omp-compat.json)" >> "$GITHUB_ENV"
      - name: Install OMP ${{ matrix.track }} for native behavior
        run: npm install --global "@oh-my-pi/pi-coding-agent@${OMP_VERSION}"
      - name: Install pinned TypeScript LSP for native route proof
        run: npm install --global typescript-language-server@5.1.3 typescript@5.9.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-darwin-x64-none-attempt-${{ needs['resolve-candidate'].outputs.producer_attempt }}
          path: ${{ runner.temp }}/native/darwin-x64-none
          run-id: ${{ needs['resolve-candidate'].outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Certify downloaded archive on OMP ${{ matrix.track }}
        run: |
          python3 scripts/native-candidate.py native --version "$CANDIDATE_VERSION" \
            --platform "$TARGET" --source-sha "$SOURCE_SHA" \
            --omp-version "$OMP_VERSION" --omp-track "$OMP_TRACK" \
            --asset "$RUNNER_TEMP/native/$TARGET/asset.json" \
            --archive-dir "$RUNNER_TEMP/native/$TARGET" \
            --out "$RUNNER_TEMP/native-receipt/receipt.json"
      - name: Preserve only detached bounded proof, including refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: probe-receipt-darwin-x64-none-${{ matrix.track }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-receipt/receipt.json
          if-no-files-found: warn
          retention-days: 7
