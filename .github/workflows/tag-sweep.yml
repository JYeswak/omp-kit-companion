name: Tag release gap sweep
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Detect tags without releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tag-sweep"
          if sh scripts/tag-sweep.sh --repo "$GITHUB_REPOSITORY" --receipt "$RUNNER_TEMP/tag-sweep/receipt.json"; then
            echo 'No unpublished tags.'
          else
            rc=$?
            test "$rc" -eq 1
            echo 'Unpublished tags detected; release train must resume or supersede them.'
          fi
      - name: Upload sweep receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tag-sweep-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/tag-sweep/receipt.json
          if-no-files-found: error
