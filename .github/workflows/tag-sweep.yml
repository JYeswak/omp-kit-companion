name: Tag release gap sweep
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Detect tags without published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          out="$RUNNER_TEMP/tag-sweep"
          mkdir -p "$out"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?status=completed&per_page=100" \
            > "$out/runs.json"
          set +e
          sh scripts/tag-sweep.sh \
            --repo "$GITHUB_REPOSITORY" \
            --runs-file "$out/runs.json" \
            --receipt "$out/receipt.json" \
            --release-index "$out/release-index.json"
          rc=$?
          set -e
          test "$rc" -eq 0 || test "$rc" -eq 1
          jq -e '.unresolved | length == 0' "$out/receipt.json" >/dev/null || {
            echo 'Unresolved tag gaps remain; release train did not claim completion.' >&2
            exit 1
          }
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            title="Promote run $run_id"
            active=$(gh run list --workflow release-train.yml --repo "$GITHUB_REPOSITORY" \
              --limit 100 --json displayTitle,status |
              jq -r --arg title "$title" 'any(.[]; .displayTitle == $title and .status != "completed")')
            if [ "$active" = true ]; then
              echo "Recovery already active for certified run $run_id."
            else
              gh workflow run release-train.yml --repo "$GITHUB_REPOSITORY" --ref main \
                -f candidate_run_id="$run_id"
              echo "Recovery dispatched for certified run $run_id."
            fi
          done < <(jq -r '.resume[]?.certified_run_id // empty' "$out/receipt.json")
      - name: Upload sweep receipt and release-gap index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tag-sweep-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/tag-sweep
          if-no-files-found: error
