name: Unpublished release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing vX.Y.Z tag to certify; publication is a separate gated operation
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-tag:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Require an exact, already-selected release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF" = "refs/tags/v$VERSION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/v$VERSION^{commit}")" = "$GITHUB_SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Require a changelog fragment for every merged PR
        run: |
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA^")"
          sh scripts/release-notes.sh check --base-tag "$previous_tag" --head "$GITHUB_SHA"

  native-candidate:
    needs: validate-tag
    if: github.event.repository.private == false
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.version }}
    permissions:
      contents: read

  attest-platforms:
    needs: native-candidate
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.select.outputs.platforms }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unpublished-candidate-index
          path: candidate-index/
      - name: Select the exact native-certified subset
        id: select
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          proof=candidate-index/candidate-proof.json
          index=candidate-index/release-index.json
          test "$(jq -er '.source_sha' "$proof")" = "$SOURCE_SHA"
          test "$(jq -er '.version' "$proof")" = "$VERSION"
          platforms="$(jq -cer '.certified_platforms | select(type == "array" and length > 0)' "$proof")"
          jq -e --argjson platforms "$platforms" '(.assets | keys | sort) == ($platforms | sort)' "$index" >/dev/null
          test "$(jq -er '.source_tag' "$index")" = "v$VERSION"
          printf 'platforms=%s\n' "$platforms" >> "$GITHUB_OUTPUT"

  attest:
    needs: [native-candidate, attest-platforms]
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs['attest-platforms'].outputs.platforms) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-${{ matrix.platform }}
          path: candidate/
      - name: Generate SBOM for the candidate archive
        uses: anchore/sbom-action@f6c3d0fe42c3cf876e3462574e4c9416b5e0f07a # v0.9.0
        with:
          path: candidate/
          format: spdx-json
          output-file: sbom-${{ matrix.platform }}.spdx.json
      - name: Attest build provenance for the candidate archive
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: candidate/*.tar
      - name: Attest the SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-path: candidate/*.tar
          sbom-path: sbom-${{ matrix.platform }}.spdx.json

# Deliberately no release upload, GitHub visibility change, latest pointer, or tag creation.
# P25 alone may promote the exact SHA-bound candidate after privacy and hero authorization.
