name: Unpublished release candidate
# ROLLING-RELEASE-V3: owner-bound qualification and mandatory native signed-consumer publication.
# DEVID-SIGN-V1: when the source's scripts/release-signing.json sets darwin_signing to developer-id, tag-ref signing is
# dispatched by the local Developer ID signer (scripts/sign-darwin-release.sh) and attests the darwin archive only after
# developer-id proves it is the qualified archive plus a notarized Developer ID signature (docs/release-signing.md).
# "adhoc" (the default) keeps the qualified darwin archive unchanged.
run-name: ${{ inputs.rehearsal && 'rehearse' || (inputs.certified_run_id != '' && 'sign' || 'qualify') }} ${{ inputs.version }} ${{ inputs.sha || github.sha }} train-${{ inputs.train_run_id || github.run_id }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Final artifact version (unspent until qualification succeeds)
        required: true
        type: string
      sha:
        description: Exact qualified main source; distinct from workflow execution SHA
        required: false
        type: string
      train_run_id:
        description: Owning train identity; retained across qualification and signing
        required: false
        type: string
      train_attempt:
        description: Exact owning train attempt whose immutable allocation authorizes this run
        required: false
        type: string
      base_tag:
        description: Published ancestor floor for immutable source-bound release notes
        required: false
        type: string
      certified_run_id:
        description: Successful final-version qualification whose archives MUST be signed without rebuilding
        required: false
        type: string
      darwin_sha256:
        description: SHA-256 of the locally Developer ID signed darwin archive in the v<version> draft (signing only)
        required: false
        type: string
      reuse_candidate_run_id:
        description: Prior successful same-SHA rehearsal (rehearsal only)
        required: false
        type: string
      rehearsal:
        description: Qualify a throwaway version, without tagging, signing or publishing
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read

jobs:
  validate-tag:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      train_id: ${{ steps.identity.outputs.train_id }}
      artifact_run_id: ${{ steps.identity.outputs.artifact_run_id }}
      artifact_attempt: ${{ steps.identity.outputs.artifact_attempt }}
      reuse_fast_ci: ${{ steps.identity.outputs.reuse_fast_ci }}
      developer_id: ${{ steps.identity.outputs.developer_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.sha || github.sha }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Separate workflow execution authority from exact product identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.sha || github.sha }}
          TRAIN_ID: ${{ inputs.train_run_id || github.run_id }}
          TRAIN_INPUT: ${{ inputs.train_run_id }}
          TRAIN_ATTEMPT: ${{ inputs.train_attempt }}
          BASE_TAG: ${{ inputs.base_tag }}
          CERTIFIED_RUN_ID: ${{ inputs.certified_run_id }}
          REUSE_RUN_ID: ${{ inputs.reuse_candidate_run_id }}
          REHEARSAL: ${{ inputs.rehearsal }}
          DARWIN_SHA256: ${{ inputs.darwin_sha256 }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$TRAIN_ID" =~ ^[0-9]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git -C product rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git fetch origin main --tags
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          artifact_run_id=''
          artifact_attempt="$GITHUB_RUN_ATTEMPT"
          reuse_fast_ci=false
          developer_id=false
          if [[ -n "$CERTIFIED_RUN_ID" ]]; then
            [[ "$REHEARSAL" != true && "$CERTIFIED_RUN_ID" =~ ^[0-9]+$ && -z "$REUSE_RUN_ID" ]]
            # DEVID-SIGN-V1: the source's checked-in switch decides whether a locally signed darwin archive, named by
            # its exact digest, replaces the qualified one before attestation.
            mode=adhoc
            if [[ -f product/scripts/release-signing.json ]]; then
              mode="$(jq -er 'select(.schema_version == 1) | .darwin_signing | select(. == "adhoc" or . == "developer-id")' product/scripts/release-signing.json)"
            fi
            if [[ "$mode" == developer-id ]]; then
              [[ "$DARWIN_SHA256" =~ ^[0-9a-f]{64}$ ]]
              developer_id=true
            else
              [[ -z "$DARWIN_SHA256" ]]
            fi
            [[ "$GITHUB_REF" == "refs/tags/v$VERSION" && "$GITHUB_SHA" == "$SOURCE_SHA" ]]
            [[ "$(git rev-parse "v$VERSION^{commit}")" == "$SOURCE_SHA" ]]
            artifact_run_id="$CERTIFIED_RUN_ID"
          else
            [[ "$GITHUB_REF" == refs/heads/main && -z "$DARWIN_SHA256" ]]
            if git rev-parse -q --verify "refs/tags/v$VERSION"; then
              echo 'qualification requires an unspent version; use certified_run_id for tag-ref recovery' >&2
              exit 4
            fi
            if [[ "$REHEARSAL" != true ]]; then
              [[ -n "$BASE_TAG" && -z "$REUSE_RUN_ID" ]]
              [[ "$TRAIN_INPUT" =~ ^[0-9]+$ && "$TRAIN_ATTEMPT" =~ ^[0-9]+$ ]]
              python3 scripts/release_reuse.py require-allocation --repository "$GITHUB_REPOSITORY" \
                --train-id "$TRAIN_ID" --train-attempt "$TRAIN_ATTEMPT" \
                --qualification-id "$GITHUB_RUN_ID" --qualification-attempt "$GITHUB_RUN_ATTEMPT" \
                --source-sha "$SOURCE_SHA" --version "$VERSION" --base-tag "$BASE_TAG" \
                --output selection --timeout 180
              # Bootstrap only from a qualified source carrying this protocol.
              protocol="$(git show "$SOURCE_SHA:.github/workflows/release.yml")"
              [[ "$protocol" == *'# ROLLING-RELEASE-V3:'* ]]
            fi
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&branch=main&event=push&per_page=100" \
              | jq '{workflow_runs: [.[].workflow_runs[]]}' > ci-runs.json
            if [[ "$REHEARSAL" != true ]]; then
              python3 scripts/release_reuse.py require-green --ci-runs ci-runs.json --source-sha "$SOURCE_SHA"
            fi
            printf '{"id":0}\n' > candidate-run.json
            printf '{"artifacts":[]}\n' > candidate-artifacts.json
            if [[ -n "$REUSE_RUN_ID" ]]; then
              [[ "$REHEARSAL" == true && "$REUSE_RUN_ID" =~ ^[0-9]+$ ]]
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID" > candidate-run.json
              gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID/artifacts?per_page=100" \
                | jq '{artifacts: [.[].artifacts[]]}' > candidate-artifacts.json
            fi
            python3 scripts/release_reuse.py preflight --ci-runs ci-runs.json \
              --candidate-run candidate-run.json --artifacts candidate-artifacts.json \
              --source-sha "$SOURCE_SHA" --base-version "$VERSION" --requested-run-id "$REUSE_RUN_ID" \
              --repository "$GITHUB_REPOSITORY" > reuse.out
            reuse_fast_ci="$(sed -n 's/^reuse_fast_ci=//p' reuse.out)"
            artifact_run_id="$(sed -n 's/^candidate_run_id=//p' reuse.out)"
            if [[ "$REHEARSAL" == true ]]; then
              reused_version="$(sed -n 's/^candidate_version=//p' reuse.out)"
              VERSION="${reused_version:-$VERSION-rehearsal.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT}"
            fi
          fi
          if [[ -n "$artifact_run_id" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$artifact_run_id" > reuse-producer.json
            artifact_attempt="$(jq -er '.run_attempt | select(type == "number" and . >= 1)' reuse-producer.json)"
            jq -e '.status == "completed" and .conclusion == "success"' reuse-producer.json
          fi
          if [[ -z "$BASE_TAG" ]]; then BASE_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$SOURCE_SHA^")"; fi
          sh scripts/release-notes.sh check --base-tag "$BASE_TAG" --head "$SOURCE_SHA"
          printf 'version=%s\nsource_sha=%s\ntrain_id=%s\nartifact_run_id=%s\nartifact_attempt=%s\nreuse_fast_ci=%s\ndeveloper_id=%s\n' \
            "$VERSION" "$SOURCE_SHA" "$TRAIN_ID" "$artifact_run_id" "$artifact_attempt" "$reuse_fast_ci" "$developer_id" >> "$GITHUB_OUTPUT"
          if [[ -z "$CERTIFIED_RUN_ID" && "$REHEARSAL" != true ]]; then
            sh scripts/release-notes.sh source --base-tag "$BASE_TAG" --head "$SOURCE_SHA" --version "$VERSION" --output "$RUNNER_TEMP/expected-notes.md"
            cmp selection/release-notes.md "$RUNNER_TEMP/expected-notes.md"
          fi
      - name: Retain the immutable release-note selection consumed by promotion
        if: inputs.certified_run_id == '' && !inputs.rehearsal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-selection-attempt-${{ github.run_attempt }}
          path: selection/
          if-no-files-found: error
          retention-days: 7

  reuse-evidence:
    needs: validate-tag
    if: github.event.repository.private == false && needs.validate-tag.outputs.artifact_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate-tag.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unpublished-candidate-index-attempt-${{ needs.validate-tag.outputs.artifact_attempt }}
          path: candidate-index/
          run-id: ${{ needs.validate-tag.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.certified_run_id != ''
        with:
          name: release-selection-attempt-${{ needs.validate-tag.outputs.artifact_attempt }}
          path: selection/
          run-id: ${{ needs.validate-tag.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Refuse a stale, partial, foreign or differently versioned producer
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.validate-tag.outputs.artifact_run_id }}
          ARTIFACT_ATTEMPT: ${{ needs.validate-tag.outputs.artifact_attempt }}
          SOURCE_SHA: ${{ needs.validate-tag.outputs.source_sha }}
          VERSION: ${{ inputs.version }}
          TRAIN_ID: ${{ needs.validate-tag.outputs.train_id }}
          CERTIFIED_RUN_ID: ${{ inputs.certified_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "$CERTIFIED_RUN_ID" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > producer-run.json
            [[ "$(jq -er .run_attempt producer-run.json)" == "$ARTIFACT_ATTEMPT" ]]
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
              | jq '{artifacts: [.[].artifacts[]]}' > producer-artifacts.json
            [[ "$(jq -er .qualification_run_id selection/selection.json)" == "$RUN_ID" ]]
            python3 scripts/release_reuse.py verify-final --proof candidate-index/candidate-proof.json \
              --index candidate-index/release-index.json --omp-config scripts/omp-compat.json \
              --source-sha "$SOURCE_SHA" --version "$VERSION" --run producer-run.json --artifacts producer-artifacts.json \
              --binding selection/selection.json --notes selection/release-notes.md --repository "$GITHUB_REPOSITORY" \
              --train-id "$TRAIN_ID" --run-id "$RUN_ID" --phase qualify
          else
            python3 scripts/release_reuse.py validate-index --proof candidate-index/candidate-proof.json \
              --index candidate-index/release-index.json --omp-config scripts/omp-compat.json \
              --source-sha "$SOURCE_SHA" --base-version "$VERSION" --run-id "$RUN_ID"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.certified_run_id != ''
        with:
          name: release-selection-attempt-${{ github.run_attempt }}
          path: selection/
          if-no-files-found: error
          retention-days: 7

  native-candidate:
    needs: validate-tag
    if: github.event.repository.private == false && needs.validate-tag.outputs.artifact_run_id == '' && inputs.certified_run_id == ''
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.validate-tag.outputs.version }}
      source_sha: ${{ needs.validate-tag.outputs.source_sha }}
      reuse_fast_ci: ${{ needs.validate-tag.outputs.reuse_fast_ci == 'true' }}
      defer_signed_consumers: true
    permissions:
      contents: read

  developer-id:
    # DEVID-SIGN-V1: nothing is attested until the locally signed darwin archive is proved to be the qualified
    # archive plus a notarized Developer ID signature by this team, and it executes (docs/release-signing.md).
    needs: [validate-tag, reuse-evidence]
    if: ${{ always() && !cancelled() && github.event.repository.private == false && needs['validate-tag'].result == 'success' && needs['reuse-evidence'].result == 'success' && needs.validate-tag.outputs.developer_id == 'true' }}
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      # A read-only token cannot see a draft release. This job downloads the signer's draft asset and never writes.
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate-tag.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unpublished-candidate-index-attempt-${{ needs.validate-tag.outputs.artifact_attempt }}
          path: qualified/
          run-id: ${{ needs.validate-tag.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-darwin-arm64-none-attempt-${{ needs.validate-tag.outputs.artifact_attempt }}
          path: qualified/
          run-id: ${{ needs.validate-tag.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Prove the draft's darwin archive is the qualified archive plus a notarized Developer ID signature, and run it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          DARWIN_SHA256: ${{ inputs.darwin_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/release_reuse.py verify-archive --index qualified/release-index.json \
            --platform darwin-arm64-none --archive-dir qualified/
          filename="$(jq -er '.assets["darwin-arm64-none"].filename' qualified/release-index.json)"
          mkdir -p signed final
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          asset="$(jq -er --arg tag "v$VERSION" --arg name "$filename" \
            '[.[][] | select(.tag_name == $tag and .draft == true) | .assets[] | select(.name == $name) | .id] | select(length == 1) | .[0]' releases.json)"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "signed/$filename"
          python3 scripts/devid_release.py verify --qualified-archive "qualified/$filename" \
            --qualified-index qualified/release-index.json --signed-archive "signed/$filename" \
            --signed-sha256 "$DARWIN_SHA256" --version "$VERSION" --execute --index-out final/release-index.json
          cp qualified/candidate-proof.json final/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devid-index-attempt-${{ github.run_attempt }}
          path: final/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devid-darwin-arm64-none-attempt-${{ github.run_attempt }}
          path: signed/
          if-no-files-found: error
          retention-days: 7


  attest-platforms:
    needs: [validate-tag, native-candidate, reuse-evidence, developer-id]
    if: ${{ always() && github.event.repository.private == false && needs['validate-tag'].result == 'success' && (needs['native-candidate'].result == 'success' || needs['reuse-evidence'].result == 'success') && (needs.validate-tag.outputs.developer_id != 'true' || needs['developer-id'].result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      platforms: ${{ steps.select.outputs.platforms }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate-tag.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unpublished-candidate-index-attempt-${{ needs.validate-tag.outputs.artifact_attempt }}
          path: candidate-index/
          run-id: ${{ needs.validate-tag.outputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.validate-tag.outputs.developer_id == 'true'
        with:
          name: devid-index-attempt-${{ github.run_attempt }}
          path: devid-index/
      - name: Require exact source, final version, ship set and both pinned tracks
        id: select
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          SOURCE_SHA: ${{ needs.validate-tag.outputs.source_sha }}
          DEVELOPER_ID: ${{ needs.validate-tag.outputs.developer_id }}
        run: |
          set -euo pipefail
          if [[ "$DEVELOPER_ID" == true ]]; then
            # Signing carries the Developer ID index: only its darwin digests differ (proved by developer-id).
            cmp candidate-index/candidate-proof.json devid-index/candidate-proof.json
            cp devid-index/release-index.json candidate-index/release-index.json
          fi
          python3 scripts/release_reuse.py verify-index --proof candidate-index/candidate-proof.json \
            --index candidate-index/release-index.json --omp-config scripts/omp-compat.json \
            --source-sha "$SOURCE_SHA" --version "$VERSION"
          echo 'platforms=["darwin-arm64-none","linux-arm64-gnu","linux-x64-gnu"]' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: needs.validate-tag.outputs.artifact_run_id != ''
        with:
          name: unpublished-candidate-index-attempt-${{ github.run_attempt }}
          path: candidate-index/
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: [validate-tag, attest-platforms]
    if: ${{ always() && !cancelled() && github.event.repository.private == false && needs['validate-tag'].result == 'success' && needs['attest-platforms'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs['attest-platforms'].outputs.platforms) }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate-tag.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: matrix.platform != 'darwin-arm64-none' || needs.validate-tag.outputs.developer_id != 'true'
        with:
          name: candidate-${{ matrix.platform }}-attempt-${{ needs.validate-tag.outputs.artifact_attempt }}
          path: candidate/
          run-id: ${{ needs.validate-tag.outputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: matrix.platform == 'darwin-arm64-none' && needs.validate-tag.outputs.developer_id == 'true'
        with:
          name: devid-darwin-arm64-none-attempt-${{ github.run_attempt }}
          path: candidate/
      # Developer ID signing: the index attest-platforms uploaded to this run; otherwise the qualified index, as before.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unpublished-candidate-index-attempt-${{ needs.validate-tag.outputs.developer_id == 'true' && github.run_attempt || needs.validate-tag.outputs.artifact_attempt }}
          path: candidate-index/
          run-id: ${{ needs.validate-tag.outputs.developer_id == 'true' && github.run_id || (needs.validate-tag.outputs.artifact_run_id || github.run_id) }}
          github-token: ${{ github.token }}
      - name: Verify the certified bytes before SBOM or signing
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/release_reuse.py verify-archive --index candidate-index/release-index.json --platform "$PLATFORM" --archive-dir candidate/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: needs.validate-tag.outputs.artifact_run_id != ''
        with:
          name: candidate-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Generate SBOM for the exact candidate archive
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: candidate/
          format: spdx-json
          artifact-name: sbom-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          output-file: ${{ github.workspace }}/sbom-${{ matrix.platform }}.spdx.json
          upload-release-assets: false
      - name: Attest build provenance at the final tag ref
        if: inputs.certified_run_id != '' && !inputs.rehearsal
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: candidate/*.tar
      - name: Attest the SBOM at the final tag ref
        if: inputs.certified_run_id != '' && !inputs.rehearsal
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b
        with:
          subject-path: candidate/*.tar
          sbom-path: ${{ github.workspace }}/sbom-${{ matrix.platform }}.spdx.json

  attest-index:
    # Preserve the index-signing rider as well as per-platform archive signing.
    needs: [validate-tag, attest-platforms]
    if: ${{ always() && !cancelled() && github.event.repository.private == false && needs['validate-tag'].result == 'success' && needs['attest-platforms'].result == 'success' && inputs.certified_run_id != '' && !inputs.rehearsal }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unpublished-candidate-index-attempt-${{ needs.validate-tag.outputs.developer_id == 'true' && github.run_attempt || needs.validate-tag.outputs.artifact_attempt }}
          path: candidate-index/
          run-id: ${{ needs.validate-tag.outputs.developer_id == 'true' && github.run_id || needs.validate-tag.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: candidate-index/release-index.json

  signed-consumers:
    # Public installation needs the real tag and Sigstore authority. It is
    # mandatory after signing, never faked during tagless qualification.
    needs: [validate-tag, attest, attest-index]
    if: ${{ always() && !cancelled() && github.event.repository.private == false && needs['validate-tag'].result == 'success' && needs['attest'].result == 'success' && needs['attest-index'].result == 'success' && inputs.certified_run_id != '' && !inputs.rehearsal }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64-none, runner: macos-15 }
          - { platform: linux-arm64-gnu, runner: ubuntu-24.04-arm }
          - { platform: linux-x64-gnu, runner: ubuntu-24.04 }
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate-tag.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Install the source-pinned certified OMP and TypeScript LSP
        run: |
          set -euo pipefail
          omp_version="$(jq -er .certified scripts/omp-compat.json)"
          npm install --global "@oh-my-pi/pi-coding-agent@$omp_version" typescript-language-server@5.1.3 typescript@5.9.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-journey/candidate/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unpublished-candidate-index-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-journey/candidate/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-selection-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-journey/selection/
      - name: Exercise the signed public installer and compiled upgrade on the same final bytes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          SOURCE_SHA: ${{ needs.validate-tag.outputs.source_sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          J="$RUNNER_TEMP/signed-journey"
          index="$J/candidate/release-index.json"
          gh attestation verify "$index" --repo "$GITHUB_REPOSITORY" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$SOURCE_SHA" --predicate-type https://slsa.dev/provenance/v1
          previous_tag="$(jq -er .base_tag "$J/selection/selection.json")"
          previous_version="${previous_tag#v}"
          gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern release-index.json --dir "$J/previous"
          previous_archive="$(python3 installer/install.py inspect "$J/previous/release-index.json" "$previous_version" "$PLATFORM")"
          gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$previous_archive" --dir "$J/previous"
          candidate_archive="$(python3 installer/install.py inspect "$index" "$VERSION" "$PLATFORM")"
          python3 installer/install.py bundle "$J/previous/$previous_archive" "$previous_version" "$PLATFORM"
          python3 installer/install.py bundle "$J/candidate/$candidate_archive" "$VERSION" "$PLATFORM"
          sh installer/install.sh --version "$VERSION" --index "$index" \
            --offline "$J/candidate/$candidate_archive" --prefix "$J/public-candidate"
          observed_candidate_version="$("$J/public-candidate/bin/omp-kit" --version)"
          [[ "$observed_candidate_version" == "omp-kit $VERSION" ]] || {
            echo 'signed public candidate installation reported the wrong version' >&2
            exit 4
          }
          sh tests/e2e/real-home-journey.sh \
            --previous-archive "$J/previous/$previous_archive" \
            --previous-index "$J/previous/release-index.json" \
            --candidate-archive "$J/candidate/$candidate_archive" \
            --candidate-index "$index" --work-dir "$J/run" \
            --receipt-out "$RUNNER_TEMP/signed-consumer-$PLATFORM-attempt-$GITHUB_RUN_ATTEMPT/receipt.json" --source-sha "$SOURCE_SHA" \
            --platform "$PLATFORM" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain the actual signed-consumer result, never raw private logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-consumer-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-consumer-${{ matrix.platform }}-attempt-${{ github.run_attempt }}/receipt.json
          if-no-files-found: error
          retention-days: 7

  signing-complete:
    # Reuse intentionally skips native-candidate. Its skipped ancestor must not
    # suppress signing, or turn a run with no signatures/consumers green.
    needs: [validate-tag, developer-id, attest-platforms, attest, attest-index, signed-consumers]
    if: ${{ always() && !cancelled() && github.event.repository.private == false && inputs.certified_run_id != '' && !inputs.rehearsal }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every signing and real-consumer gate to have executed successfully
        env:
          VALIDATE_RESULT: ${{ needs['validate-tag'].result }}
          DEVELOPER_ID: ${{ needs.validate-tag.outputs.developer_id }}
          DEVELOPER_ID_RESULT: ${{ needs['developer-id'].result }}
          PLATFORMS_RESULT: ${{ needs['attest-platforms'].result }}
          ATTEST_RESULT: ${{ needs['attest'].result }}
          INDEX_RESULT: ${{ needs['attest-index'].result }}
          CONSUMERS_RESULT: ${{ needs['signed-consumers'].result }}
        run: |
          set -euo pipefail
          for result in "$VALIDATE_RESULT" "$PLATFORMS_RESULT" "$ATTEST_RESULT" "$INDEX_RESULT" "$CONSUMERS_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "required signing gate did not succeed: $result" >&2
              exit 1
            fi
          done
          # DEVID-SIGN-V1: Developer ID mode requires the derivation proof; adhoc mode never runs it.
          expected=skipped
          if [[ "$DEVELOPER_ID" == true ]]; then expected=success; fi
          if [[ "$DEVELOPER_ID_RESULT" != "$expected" ]]; then
            echo "developer-id gate is $DEVELOPER_ID_RESULT, expected $expected" >&2
            exit 1
          fi

  open-p0-on-post-cert-failure:
    needs: [validate-tag, reuse-evidence, developer-id, attest-platforms, attest, attest-index, signed-consumers, signing-complete]
    if: ${{ always() && github.event.repository.private == false && failure() && inputs.certified_run_id != '' && !inputs.rehearsal }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Report failure after exact-artifact qualification; never rebuild or weaken a gate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
        run: |
          sh scripts/candidate-failure.sh --repo "$GITHUB_REPOSITORY" --version "$VERSION" \
            --sha "$SHA" --run-id "$GITHUB_RUN_ID"

# Publication remains exclusively in release-train.yml after exact signed-byte verification.
