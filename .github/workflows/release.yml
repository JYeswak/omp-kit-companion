name: Unpublished release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing vX.Y.Z tag to certify (for a rehearsal, the intended next X.Y.Z, which must have no tag yet); publication is a separate gated operation
        required: true
        type: string
      rehearsal:
        description: Dispatch from main with no tag; runs the whole pipeline on a throwaway X.Y.Z-rehearsal.RUN.ATTEMPT version and signs nothing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-tag:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Require an exact, already-selected release tag, or a tagless rehearsal from main
        id: identity
        env:
          VERSION: ${{ inputs.version }}
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$REHEARSAL" == "true" ]]; then
            # The rehearsed SHA is main's head, the commit a tag would name; the real version must still be unspent.
            test "$GITHUB_REF" = "refs/heads/main"
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "v$VERSION is already tagged; a rehearsal needs a version no tag has spent" >&2
              exit 1
            fi
            printf 'version=%s-rehearsal.%s.%s\n' "$VERSION" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          else
            test "$GITHUB_REF" = "refs/tags/v$VERSION"
            test "$(git rev-parse "refs/tags/v$VERSION^{commit}")" = "$GITHUB_SHA"
            printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Require a changelog fragment for every merged PR
        run: |
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA^")"
          sh scripts/release-notes.sh check --base-tag "$previous_tag" --head "$GITHUB_SHA"

  native-candidate:
    needs: validate-tag
    if: github.event.repository.private == false
    # CI produces provisional artifacts; the attestation gate validates only the ship set below.
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.validate-tag.outputs.version }}
    permissions:
      contents: read

  attest-platforms:
    needs: [validate-tag, native-candidate]
    # Run after the producer even when unrelated CI jobs fail; artifact validation fails closed.
    if: ${{ always() && github.event.repository.private == false && needs['native-candidate'].result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.select.outputs.platforms }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unpublished-candidate-index
          path: candidate-index/
      - name: Require the exact certified ship set
        id: select
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          proof=candidate-index/candidate-proof.json
          index=candidate-index/release-index.json
          test "$(jq -er '.source_sha' "$proof")" = "$SOURCE_SHA"
          test "$(jq -er '.version' "$proof")" = "$VERSION"
          platforms="$(jq -cer '.certified_platforms | select(type == "array" and length > 0)' "$proof")"
          # Intel macOS is non-shipping; all three published targets are required.
          jq -e --argjson platforms "$platforms" '($platforms | sort) == ["darwin-arm64-none","linux-arm64-gnu","linux-x64-gnu"]' "$proof" >/dev/null
          jq -e --argjson platforms "$platforms" '(.assets | keys | sort) == ($platforms | sort)' "$index" >/dev/null
          test "$(jq -er '.source_tag' "$index")" = "v$VERSION"
          printf 'platforms=%s\n' "$platforms" >> "$GITHUB_OUTPUT"

  attest:
    # Only the validated ship set gates attestation, not unrelated CI jobs.
    needs: attest-platforms
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs['attest-platforms'].outputs.platforms) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-${{ matrix.platform }}
          path: candidate/
      - name: Generate SBOM for the candidate archive
        # v0.9.0 bundled @actions/artifact 0.6 (retired v1 API): every SBOM step failed with "Create Artifact
        # Container failed" in 0.2.10, 0.2.11 and 0.2.16. v0.24.3 uses @actions/artifact 6 and declares output-file.
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: candidate/
          format: spdx-json
          artifact-name: sbom-${{ matrix.platform }}
          output-file: ${{ github.workspace }}/sbom-${{ matrix.platform }}.spdx.json
          upload-release-assets: false
      - name: Attest build provenance for the candidate archive
        if: ${{ !inputs.rehearsal }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: candidate/*.tar
      - name: Attest the SBOM
        if: ${{ !inputs.rehearsal }}
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-path: candidate/*.tar
          sbom-path: ${{ github.workspace }}/sbom-${{ matrix.platform }}.spdx.json

# Deliberately no release upload, GitHub visibility change, latest pointer, or tag creation.
# P25 alone may promote the exact SHA-bound candidate after privacy and hero authorization.
