name: Release train

# RELTRAIN1 (ompkit-v66l): every green main commit that has release notes
# becomes the next patch release, newest green wins, with no human cut. The
# manual cut in docs/release-procedure.md remains the documented fallback.
#
# How it works:
# - A CI push run completing on main -> train job decides
#   (scripts/release-train.sh): red CI is never tagged, and a SHA that is no
#   longer main's head is left to the newer train. One train at a time
#   (concurrency group, cancel-in-progress false); each train waits for the
#   release lane to go idle and re-decides after the wait, so three greens
#   during one release produce exactly one queued train: the newest.
# - The winning SHA gets the upstream oh-my-pi release commit
#   (scripts/release.ts): `release-train.sh bump` folds changelog.d/ into
#   CHANGELOG.md [Unreleased], promotes it to `## [X.Y.Z] - DATE`, sets both
#   package.json versions, and commits `chore: bump version to X.Y.Z` on the
#   SHA. Nothing to release (no entries, no fragments) skips: no tag, never an
#   empty release.
# - Two stages, no circularity (ompkit-fp72.49): stage 1 pushes the bump commit
#   to main UNTAGGED with a `refs/train/pending-vX.Y.Z` ref recording the bump
#   SHA; that SHA's own push run certifies it (native-cert for every shipped
#   platform/track). Stage 2 (tag-after-green) creates the tag ON that exact SHA
#   only after its run is green, then dispatches the candidate, which recertifies
#   the final release-version artifacts. Red/cancelled/running => no tag, reason logged.
# - Stage 2 dispatches release.yml from main head with the bump SHA (a tag-head run
#   completion would never fire the publish job); it reuses the green CI of the
#   parent (`release-train.sh evidence-sha`) and refuses a tag whose
#   package.json or CHANGELOG section does not match.
# - The candidate release completing green -> publish job reads the version
#   and SHA back out of the verified candidate proof (never out of branch
#   names), verifies the unpublished candidate index for exactly that version
#   and SHA, and creates the GitHub release with the tag's CHANGELOG section
#   as its body (upstream ci-release-notes.ts). Rehearsal runs publish nothing.
#   A train finishing late publishes without taking Latest from a newer
#   release.
# - Red main never releases: decide refuses anything but a green head, and
#   scheduled (non-push) CI runs never enter the train.

on:
  workflow_run:
    workflows: ["CI", "Unpublished release candidate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Green main SHA to release (must still be main head)
        required: true
        type: string
      version:
        description: Patch version override (default next after max tag)
        required: false
        type: string
      rehearsal:
        description: Rehearse the release without tagging or publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  train:
    if: >-
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.name == 'CI' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      actions: write
    outputs:
      go: ${{ steps.redecide.outputs.go }}
      version: ${{ steps.version.outputs.version }}
      bump_sha: ${{ steps.bump.outputs.bump_sha }}
      release: ${{ steps.bump.outputs.release }}
    steps:
      - name: Resolve the candidate SHA and its CI verdict
        id: event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            sha="${{ inputs.sha }}"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a 40-hex commit" >&2; exit 2; }
            echo "sha=$sha"
            echo "conclusion=success"
            echo "status=completed"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}"
            echo "conclusion=${{ github.event.workflow_run.conclusion }}"
            # A completed workflow_run event carries only finished runs.
            echo "status=completed"
          fi
          echo "head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.event.outputs.sha }}
          # promote reads changelog.d/ and CHANGELOG.md; the bump commit needs the SHA's parentage.
          fetch-depth: 0
      # The train's scripts come from the same commit as this workflow file, not from the candidate:
      # a candidate older than the workflow (the first train after a train change) would otherwise
      # run a release-train.sh that lacks the subcommands this file calls.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: .train-tools
          persist-credentials: false
      - name: Decide whether this SHA may tag
        id: decide
        run: |
          set -euo pipefail
          set +e
          sh .train-tools/scripts/release-train.sh decide \
            --conclusion "${{ steps.event.outputs.conclusion }}" \
            --run-status "${{ steps.event.outputs.status }}" \
            --sha "${{ steps.event.outputs.sha }}" \
            --head "${{ steps.event.outputs.head }}" | tee decide.out
          rc=${PIPESTATUS[0]}
          set -e
          # A step's `exit 0` does not stop the job: later steps gate on this output.
          if [[ "$rc" -eq 4 ]]; then echo "train skips this SHA: $(cat decide.out)"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          [[ "$rc" -eq 0 ]] || exit "$rc"
          grep -q '^DECIDE=tag' decide.out
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Wait for the release lane to go idle
        if: steps.decide.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sh .train-tools/scripts/release-train.sh wait-release-idle \
            --repo "${{ github.repository }}" --timeout 7200 --poll 60
      - name: Re-decide after the wait (latest green still wins)
        id: redecide
        if: steps.decide.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          set +e
          sh .train-tools/scripts/release-train.sh decide \
            --conclusion "${{ steps.event.outputs.conclusion }}" \
            --run-status "${{ steps.event.outputs.status }}" \
            --sha "${{ steps.event.outputs.sha }}" \
            --head "$head" | tee redecide.out
          rc=${PIPESTATUS[0]}
          set -e
          if [[ "$rc" -eq 4 ]]; then echo "train skips this SHA: $(cat redecide.out)"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          [[ "$rc" -eq 0 ]] || exit "$rc"
          grep -q '^DECIDE=tag' redecide.out
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Select the next patch version
        id: version
        if: steps.redecide.outputs.go == 'true'
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$VERSION_OVERRIDE" ]]; then
            [[ "$VERSION_OVERRIDE" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "version override must be X.Y.Z" >&2; exit 2; }
            git ls-remote --tags origin | grep -q "refs/tags/v$VERSION_OVERRIDE$" && { echo "v$VERSION_OVERRIDE is already tagged" >&2; exit 4; }
            version="$VERSION_OVERRIDE"
          else
            version="$(git ls-remote --tags origin | sh .train-tools/scripts/release-train.sh next-version)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "selected $version"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.redecide.outputs.go == 'true'
      - name: Fold the changelog and commit the release bump (upstream oh-my-pi scripts/release.ts shape)
        id: bump
        if: steps.redecide.outputs.go == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          sh .train-tools/scripts/release-train.sh bump --version "$VERSION" --date "$(date -u +%F)" | tee bump.out
          rc=${PIPESTATUS[0]}
          set -e
          if [[ "$rc" -eq 4 ]]; then
            # No CHANGELOG entries and no fragments: never tag a release with an empty body.
            echo "train skips this SHA: $(grep '^BUMP=' bump.out)"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$rc" -eq 0 ]] || exit "$rc"
          sh .train-tools/scripts/release-notes.sh notes --version "$VERSION" --output "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "bump_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Push the bump commit untagged with its pending ref (stage 1 of 2)
        if: steps.bump.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.event.outputs.sha }}
          BUMP_SHA: ${{ steps.bump.outputs.bump_sha }}
          VERSION: ${{ steps.version.outputs.version }}
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          set -euo pipefail
          if [[ "$REHEARSAL" == "true" ]]; then
            # Tagless rehearsal from main: the bump above stays local; the version must still be unspent.
            git ls-remote --tags origin | grep -q "refs/tags/v$VERSION$" && { echo "v$VERSION is already tagged; a rehearsal needs an unspent version" >&2; exit 4; }
            gh workflow run release.yml --ref main -f version="$VERSION" -f rehearsal=true
            exit 0
          fi
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$remote_main" != "$SHA" ]]; then echo "train skips this SHA: main moved to $remote_main; the newer train releases it"; exit 0; fi
          # Stage 1 of the 2-stage train (ompkit-fp72.49): the bump lands on main WITHOUT a tag.
          # Its own push run certifies that exact SHA; stage 2 (tag-after-green) tags it only on
          # green, matching the CI head_sha to the recorded bump SHA, then dispatches the candidate.
          # The pending ref records which SHA the train bumped. Stale pending refs from superseded
          # trains are deleted in the same atomic push so stage 2 never matches an older bump.
          pending="refs/train/pending-v$VERSION"
          stale="$(git ls-remote origin 'refs/train/pending-v*' | awk -v keep="$pending" '$2 != keep { print ":"$2 }')"
          # The bump is a fast-forward of the green SHA; branch and pending ref land together or not at all.
          # shellcheck disable=SC2086
          git push --atomic origin "$BUMP_SHA:refs/heads/main" "$BUMP_SHA:$pending" $stale

  certify-bump:
    # fp72.65: GITHUB_TOKEN pushes start no push workflow, so the bump is
    # certified by calling CI on it inside this run (full native set; a fresh
    # bump sha has nothing reusable, so reuse_fast_ci is false). Cost per
    # bump is one candidate-class run (~16 min macOS critical path).
    needs: [train]
    if: ${{ github.event.repository.private == false && inputs.rehearsal != 'true' && needs.train.outputs.release == 'true' }}
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.train.outputs.version }}
      source_sha: ${{ needs.train.outputs.bump_sha }}
      reuse_fast_ci: false
    permissions:
      contents: read

  tag-certified-bump:
    needs: [train, certify-bump]
    if: ${{ github.event.repository.private == false && inputs.rehearsal != 'true' && needs.train.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Download the native receipts this run recorded
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-receipt-*
          path: receipts/
          merge-multiple: true
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Prove the receipts certify this bump, then tag it and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.train.outputs.version }}
          BUMP_SHA: ${{ needs.train.outputs.bump_sha }}
        run: |
          set -euo pipefail
          sh scripts/verify-bump-cert.sh --version "$VERSION" --sha "$BUMP_SHA" --receipts receipts/
          # Tag the exact certified SHA and retire its pending ref together or not at all.
          git push --atomic origin "$BUMP_SHA:refs/tags/v$VERSION" ":refs/train/pending-v$VERSION"
          # Dispatch from main head (ompkit-dj7d): a tag-head run completion is never delivered,
          # so the publish job would never fire. The sha input pins the exact bump commit; the
          # candidate identity refuses unless the tag names it and the run started on it.
          gh workflow run release.yml --ref main -f version="$VERSION" -f sha="$BUMP_SHA"

  publish:
    if: >-
      github.event.repository.private == false &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Unpublished release candidate' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-train-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Fetch the candidate proof and read back its version and SHA
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p candidate-index archives
          gh run download "$RUN_ID" --repo "${{ github.repository }}" \
            -n unpublished-candidate-index -D candidate-index/
          version="$(jq -er .version candidate-index/candidate-proof.json)"
          sha="$(jq -er .source_sha candidate-index/candidate-proof.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-rehearsal.* ]]; then echo "rehearsal=true" >> "$GITHUB_OUTPUT"; else echo "rehearsal=false" >> "$GITHUB_OUTPUT"; fi
          for platform in $(jq -r '.certified_platforms[]' candidate-index/candidate-proof.json); do
            gh run download "$RUN_ID" --repo "${{ github.repository }}" \
              -n "candidate-$platform" -D "archives/$platform/"
          done
      - name: Publish nothing for a rehearsal run
        if: steps.candidate.outputs.rehearsal == 'true'
        run: |
          echo "rehearsal ${{ steps.candidate.outputs.version }} verified and skipped: nothing published"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.candidate.outputs.rehearsal != 'true'
      - name: Verify the candidate, then create the GitHub release
        if: steps.candidate.outputs.rehearsal != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.candidate.outputs.version }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          # The tag the train created must name exactly this SHA, or nothing publishes.
          [[ "$(git rev-parse "v$VERSION^{commit}")" == "$SHA" ]] || { echo "v$VERSION does not name $SHA" >&2; exit 4; }
          sh scripts/release-train.sh verify-candidate \
            --proof candidate-index/candidate-proof.json \
            --index candidate-index/release-index.json \
            --version "$VERSION" --sha "$SHA"
          max="$(git ls-remote --tags origin | grep -oE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's#refs/tags/v##' | sort -V | tail -1)"
          latest_flag="$(sh scripts/release-train.sh latest-flag --version "$VERSION" --max-version "$max")"
          # Release body = the tag's CHANGELOG section(s), as upstream ci-release-notes.ts does:
          # (newest published release below VERSION, VERSION], so a tag that never got a GitHub
          # release is not stranded. An absent or empty section refuses (exit 4): nothing publishes.
          floor="$(gh release list --repo "${{ github.repository }}" --limit 200 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' \
            | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | { cat; printf '%s\n' "$VERSION"; } | sort -uV \
            | awk -v v="$VERSION" '$0 == v { print prev; exit } { prev = $0 }')"
          floor_args=()
          if [[ -n "$floor" ]]; then floor_args=(--floor "$floor"); fi
          sh scripts/release-notes.sh notes --version "$VERSION" --ref "v$VERSION" "${floor_args[@]}" --output release-notes.md
          if [[ -n "$floor" ]]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/v%s...v%s\n' "${{ github.repository }}" "$floor" "$VERSION" >> release-notes.md
          fi
          files=(candidate-index/release-index.json)
          for tar in archives/*/*.tar; do files+=("$tar"); done
          # shellcheck disable=SC2086
          gh release create "v$VERSION" --repo "${{ github.repository }}" \
            --target "$SHA" --title "v$VERSION" --notes-file release-notes.md $latest_flag \
            "${files[@]}"
