name: Release train
run-name: ${{ inputs.candidate_run_id != '' && format('Promote run {0}', inputs.candidate_run_id) || (github.event.workflow_run.display_title && format('Publish {0}', github.event.workflow_run.display_title)) || format('Train {0}', github.run_id) }}

# One active release, newest qualified pending. The job lock includes the
# publication outcome; running/red descendants never invalidate its pinned Q,V.
# Qualification builds final-version archives before any tag exists. Only the
# separately running publisher may tag, request tag-ref signing of those SAME
# archives, and publish after the signing workflow succeeds.
on:
  workflow_run:
    workflows: ["CI", "Unpublished release candidate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Optional qualified main source (must be the newest qualified unreleased source)
        required: false
        type: string
      version:
        description: Optional version at or above the next tag/changelog floor
        required: false
        type: string
      rehearsal:
        description: Certify without tagging, signing or publishing
        default: false
        type: boolean
      candidate_run_id:
        description: Recover promotion from an existing successful qualification; never rebuild it
        required: false
        type: string
permissions:
  contents: read
  actions: read

jobs:
  train:
    if: >-
      github.event.repository.private == false &&
      ((github.event_name == 'workflow_dispatch' && inputs.candidate_run_id == '') ||
       (github.event.workflow_run.path == '.github/workflows/ci.yml' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
       (github.event.workflow_run.path == '.github/workflows/release.yml' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_branch == 'main' &&
        startsWith(github.event.workflow_run.display_title, 'rehearse ')))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: release-train-active
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      # A terminal rehearsal only wakes qualified-source reconciliation.
      # Its unsigned artifacts never become production promotion authority.
      - name: Reconcile the qualified owner before waiting for a new allocation
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
          VERSION_OVERRIDE: ${{ inputs.version }}
          REHEARSAL: ${{ inputs.rehearsal || 'false' }}
        run: |
          set -euo pipefail
          # Keep this job's lock through certification AND the independent
          # publisher's terminal outcome. No next train may reuse an in-flight V.
          git fetch origin main --tags
          python3 scripts/release_reuse.py drive --stage prepare --repository "$GITHUB_REPOSITORY" \
            --train-id "$GITHUB_RUN_ID" --train-attempt "$GITHUB_RUN_ATTEMPT" --requested "$REQUESTED_SHA" \
            --version "$VERSION_OVERRIDE" --rehearsal "$REHEARSAL" --plan "$RUNNER_TEMP/rolling-release-plan.json"
      - name: Persist immutable owner allocation before dispatch
        id: allocation
        if: steps.prepare.outputs.allocate == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-allocation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-allocation/
          if-no-files-found: error
          retention-days: 7
      - name: Dispatch exactly the owner allocation and retain the native run ID
        if: steps.prepare.outputs.allocate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOCATION_ID: ${{ steps.allocation.outputs.artifact-id }}
        run: |
          python3 scripts/release_reuse.py drive --stage dispatch --repository "$GITHUB_REPOSITORY" \
            --train-id "$GITHUB_RUN_ID" --train-attempt "$GITHUB_RUN_ATTEMPT" \
            --allocation-artifact-id "$ALLOCATION_ID" --plan "$RUNNER_TEMP/rolling-release-plan.json"
      - name: Bind the canonical qualification in immutable owner authority
        if: ${{ always() && steps.prepare.outputs.allocate == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-qualification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-qualification/qualification.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain allocation custody until the independently verified publication outcome
        if: steps.prepare.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_reuse.py drive --stage watch --repository "$GITHUB_REPOSITORY" \
            --train-id "$GITHUB_RUN_ID" --train-attempt "$GITHUB_RUN_ATTEMPT" \
            --plan "$RUNNER_TEMP/rolling-release-plan.json" --timeout 7200

  publish:
    # ABRPRIVATE1 authorizes certified companion publication, not a global
    # private-repository billing exception. Artifact authority is checked below.
    if: >-
      (github.event.repository.private == false ||
       github.repository == 'JYeswak/omp-kit-companion') &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.path == '.github/workflows/release.yml' &&
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.display_title, 'qualify ')) ||
       (github.event_name == 'workflow_dispatch' && inputs.candidate_run_id != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-train-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
      attestations: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Verify the producer and exact final candidate before promotion
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > producer-run.json
          # Rehearsals are intentionally tagless and carry no production selection.
          if [[ "$(jq -r '.display_title | (startswith("qualify ") or startswith("sign "))' producer-run.json)" != true ]]; then
            echo 'not an authorized rolling production candidate; refusing promotion' >&2
            exit 4
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            | jq '{artifacts: [.[].artifacts[]]}' > producer-artifacts.json
          mkdir -p candidate-index selection archives sboms
          attempt="$(jq -er '.run_attempt | select(type == "number" and . >= 1)' producer-run.json)"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n "unpublished-candidate-index-attempt-$attempt" -D candidate-index/
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n "release-selection-attempt-$attempt" -D selection/
          version="$(jq -er .version candidate-index/candidate-proof.json)"
          sha="$(jq -er .source_sha candidate-index/candidate-proof.json)"
          train_id="$(jq -er .train_run_id selection/selection.json)"
          train_attempt="$(jq -er .train_attempt selection/selection.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$train_id" =~ ^[0-9]+$ && "$train_attempt" =~ ^[0-9]+$ ]]
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          phase="$(jq -er '.display_title | split(" ")[0]' producer-run.json)"
          git show "$sha:scripts/omp-compat.json" > omp-config.json
          git merge-base --is-ancestor "$sha" origin/main
          if [[ "$phase" == qualify ]]; then
            git merge-base --is-ancestor "$sha" "$(jq -er .head_sha producer-run.json)"
          fi
          python3 scripts/release_reuse.py verify-final --proof candidate-index/candidate-proof.json \
            --index candidate-index/release-index.json --omp-config omp-config.json \
            --source-sha "$sha" --version "$version" --run producer-run.json --artifacts producer-artifacts.json \
            --binding selection/selection.json --notes selection/release-notes.md --repository "$GITHUB_REPOSITORY" \
            --train-id "$train_id" --run-id "$RUN_ID" --phase "$phase"
          base_tag="$(jq -er .base_tag selection/selection.json)"
          sh scripts/release-notes.sh source --base-tag "$base_tag" --head "$sha" --version "$version" --output expected-notes.md
          cmp selection/release-notes.md expected-notes.md
          for platform in darwin-arm64-none linux-arm64-gnu linux-x64-gnu; do
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n "candidate-$platform-attempt-$attempt" -D "archives/$platform/"
            python3 scripts/release_reuse.py verify-archive --index candidate-index/release-index.json \
              --platform "$platform" --archive-dir "archives/$platform/"
            if [[ "$phase" == sign ]]; then
              gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n "sbom-$platform-attempt-$attempt" -D "sboms/$platform/"
              # The SBOM action names the uploaded member after artifact-name.
              # Preserve its bytes while staging the stable public asset name.
              mv "sboms/$platform/sbom-$platform-attempt-$attempt" "sboms/$platform/sbom-$platform.spdx.json"
            fi
          done
          printf 'promote=true\nversion=%s\nsha=%s\nphase=%s\ntrain_id=%s\ntrain_attempt=%s\nbase_tag=%s\n' \
            "$version" "$sha" "$phase" "$train_id" "$train_attempt" "$base_tag" >> "$GITHUB_OUTPUT"
      - name: Dispatch the optional Intel probe without waiting for its outcome
        if: steps.candidate.outputs.promote == 'true' && steps.candidate.outputs.phase == 'qualify'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          python3 scripts/release_reuse.py require-attempt --repository "$GITHUB_REPOSITORY" --run producer-run.json
          attempt="$(jq -er '.run_attempt | select(type == "number" and . >= 1)' producer-run.json)"
          timeout 60s gh workflow run release-intel-probe.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f candidate_run_id="$RUN_ID" -f candidate_run_attempt="$attempt"
      - name: Tag only the fully qualified source, then sign the same bytes at the tag ref
        if: steps.candidate.outputs.promote == 'true' && steps.candidate.outputs.phase == 'qualify'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.candidate.outputs.version }}
          SHA: ${{ steps.candidate.outputs.sha }}
          TRAIN_ID: ${{ steps.candidate.outputs.train_id }}
          TRAIN_ATTEMPT: ${{ steps.candidate.outputs.train_attempt }}
          BASE_TAG: ${{ steps.candidate.outputs.base_tag }}
          RUN_ID: ${{ inputs.candidate_run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push&per_page=100" \
            | jq '{workflow_runs: [.[].workflow_runs[]]}' > source-ci.json
          python3 scripts/release_reuse.py require-green --ci-runs source-ci.json --source-sha "$SHA"
          python3 scripts/release_reuse.py promotion --repository "$GITHUB_REPOSITORY" --source-sha "$SHA" --version "$VERSION"
          python3 scripts/release_reuse.py require-attempt --repository "$GITHUB_REPOSITORY" --run producer-run.json
          if git rev-parse -q --verify "refs/tags/v$VERSION"; then
            [[ "$(git rev-parse "v$VERSION^{commit}")" == "$SHA" ]]
          else
            # A token `git push` of a tag on an older commit is refused whenever .github/workflows differ from the
            # branch tip (GitHub; run 39078257345). The Git Data API creates the same lightweight ref at the
            # already-qualified commit with contents: write and no workflow-file write. Existing tags still refuse below.
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$SHA" > /dev/null
            git fetch origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
            [[ "$(git rev-parse "v$VERSION^{commit}")" == "$SHA" ]]
          fi
          # The unchanged installer/updater policy binds source-digest to Q.
          # Only tag-ref release.yml has that execution identity. It downloads
          # certified archives by run ID and cannot enter a build job.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v$VERSION" -f version="$VERSION" -f sha="$SHA" \
            -f train_run_id="$TRAIN_ID" -f train_attempt="$TRAIN_ATTEMPT" -f base_tag="$BASE_TAG" -f certified_run_id="$RUN_ID"
      - name: Publish the same signed and certified artifacts, without regressive Latest
        if: steps.candidate.outputs.promote == 'true' && steps.candidate.outputs.phase == 'sign'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.candidate.outputs.version }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          [[ "$(git rev-parse "v$VERSION^{commit}")" == "$SHA" ]]
          files=(candidate-index/release-index.json)
          for platform in darwin-arm64-none linux-arm64-gnu linux-x64-gnu; do
            archive="archives/$platform/$(jq -er --arg p "$platform" '.assets[$p].filename' candidate-index/release-index.json)"
            files+=("$archive")
            sbom="sboms/$platform/sbom-$platform.spdx.json"
            test -s "$sbom"
            files+=("$sbom")
          done
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          if ! jq -e --arg tag "v$VERSION" 'any(.[][]; .tag_name == $tag)' releases.json; then
            # The certified tag already exists and is source-checked above.
            # Do not request workflow-write authority for unused tag creation.
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "v$VERSION" --notes-file selection/release-notes.md "${files[@]}"
          fi
          # Native authority and ALL remote archive/SBOM/index bytes verify
          # before idempotent success. Missing exact assets can be uploaded;
          # mismatches are never clobbered or hidden by a matching index.
          python3 scripts/release_reuse.py repair-release --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION" --source-sha "$SHA" --index candidate-index/release-index.json \
            --archives archives --sboms sboms --notes selection/release-notes.md \
            --producer-run producer-run.json --binding selection/selection.json
          latest_flag="$(python3 scripts/release_reuse.py latest-flag --repository "$GITHUB_REPOSITORY" --version "$VERSION")"
          # shellcheck disable=SC2086
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false $latest_flag
