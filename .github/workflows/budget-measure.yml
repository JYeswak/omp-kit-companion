name: budget-measure

# Scratch measurement only: paired stream totals per runner for origin/main
# vs the dispatched ref, interleaved on the SAME VM (base, cand alternating),
# so machine variance cannot confound the comparison. workflow_dispatch only.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Paired repetitions per OS
        type: string
        required: false
        default: "5"

permissions:
  contents: read

concurrency:
  group: budget-measure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Check out candidate tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          path: cand
      - name: Check out main tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: base
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install stock OMP latest
        env:
          TMPDIR: ${{ runner.temp }}
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npm install --global "@oh-my-pi/pi-coding-agent@latest"
      - name: Paired stream budget
        env:
          TMPDIR: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/budget-measure-${{ matrix.os }}"
          mkdir -p "$results_dir"
          for i in $(seq 1 "${{ inputs.runs }}"); do
            if (( i % 2 == 0 )); then order="cand base"; else order="base cand"; fi
            for target in $order; do
              output="$results_dir/run-$i-$target.log"
              rc=0
              (cd "$target" && bun scripts/regex-budget.ts --judge-regardless-of-load >"$output" 2>&1) || rc=$?
              echo "--- run $i target=$target os=${{ matrix.os }} rc=$rc"
              grep -E '^(REGEX-BUDGET:|live stream:|stream |JSON_REPORT=)' "$output" || true
            done
          done
