name: OMP latest compatibility

# OMP ships often and operators update it on their own schedule (UCA runs every 3 h). This job runs the
# CLI contracts and the full rule ladder against whatever OMP npm currently publishes, and keeps exactly one
# open issue per breaking OMP version. GitHub disables schedules after 60 days without repository activity.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      omp_version:
        description: OMP version to test (default latest)
        type: string
        required: false

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: omp-latest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A cheap Linux check: the macOS run happens only when OMP or main changed since the last green run.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || steps.tested.outputs.cache-hit != 'true' }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          OMP_SPEC: ${{ inputs.omp_version || 'latest' }}
        run: echo "version=$(npm view "@oh-my-pi/pi-coding-agent@$OMP_SPEC" version | tail -1)" >> "$GITHUB_OUTPUT"
      - id: tested
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: omp-latest-tested
          key: omp-latest-tested-${{ steps.version.outputs.version }}-${{ github.sha }}
          lookup-only: true
      - if: steps.tested.outputs.cache-hit == 'true'
        run: echo "OMP ${{ steps.version.outputs.version }} already passed on ${{ github.sha }}; skipping." >> "$GITHUB_STEP_SUMMARY"

  latest:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install the selected OMP release and TypeScript LSP
        env:
          OMP_SPEC: ${{ needs.gate.outputs.version }}
        run: |
          npm install --global "@oh-my-pi/pi-coding-agent@$OMP_SPEC" typescript-language-server@5.1.3 typescript@5.9.3
          version="$(omp --version | sed 's#^omp/##')"
          echo "OMP_VERSION=$version" >> "$GITHUB_ENV"
          echo "### OMP $version ($OMP_SPEC) on $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
      - name: CLI contracts against this OMP
        run: bun test tests/cli
      - name: Full rule ladder (G1-G4, planted negative) against this OMP
        run: |
          set -o pipefail
          sh scripts/ladder.sh 2>&1 | tee ladder.log
      - name: Report OMP late-interrupt probe outcome
        if: always()
        run: |
          {
            echo "## Late-interrupt probe (OMP $OMP_VERSION)"
            grep -E "^PROBE omp-late-interrupt: " ladder.log || echo "probe did not run (ladder ended before the probe scenario)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record G3 first-fire indices for this OMP
        if: success()
        run: |
          sh scripts/runtime-adapter.sh "$GITHUB_WORKSPACE/scripts/ttsr-harness.ts" --gate-json > gate.json
          bun -e '
            const rep = await Bun.file("gate.json").json();
            const cases = {};
            for (const c of rep.cases ?? []) cases[c.rule + ":" + c.line] = { expect: c.expect, g2: c.g2, first_fire: c.first_fire, wire_length: c.wire_length };
            await Bun.write("first-fire-" + process.env.OMP_VERSION + ".json", JSON.stringify({ schema_version: 1, omp_version: process.env.OMP_VERSION, cases }, null, 2) + "\n");
          '
      - name: Download previous first-fire baseline
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          current="first-fire-$OMP_VERSION.json"
          pick() {
            for id in $(gh run list --workflow omp-latest.yml --status completed --limit 20 --json databaseId --jq "[.[] | select(.databaseId != $RUN_ID) | .databaseId] | .[]"); do
              name=$(gh api "repos/$REPO/actions/runs/$id/artifacts" --jq '[.artifacts[] | select(.name | startswith("first-fire-")) | .name] | first // empty')
              if [ -z "$name" ]; then continue; fi
              if [ "$1" = different ] && [ "$name" = "$current" ]; then continue; fi
              echo "$id:$name"
              return 0
            done
            return 1
          }
          baseline="$(pick different || pick any || true)"
          if [ -n "$baseline" ]; then
            gh run download "${baseline%%:*}" -n "${baseline#*:}" -D baseline
            echo "BASELINE_FILE=baseline/${baseline#*:}" >> "$GITHUB_ENV"
          else
            echo "BASELINE_FILE=" >> "$GITHUB_ENV"
          fi
      - name: Report first-fire differential
        if: success()
        run: |
          {
            echo "## First-fire differential (OMP $OMP_VERSION)"
            if [ -n "$BASELINE_FILE" ]; then
              bun -e '
                const prev = await Bun.file(process.env.BASELINE_FILE).json();
                const next = await Bun.file("first-fire-" + process.env.OMP_VERSION + ".json").json();
                const keys = new Set([...Object.keys(prev.cases ?? {}), ...Object.keys(next.cases ?? {})]);
                let changed = 0;
                for (const k of [...keys].sort()) {
                  const a = prev.cases ? prev.cases[k] : undefined, b = next.cases ? next.cases[k] : undefined;
                  if (JSON.stringify(a) !== JSON.stringify(b)) { changed++; console.log("CHANGED " + k + ": " + JSON.stringify(a ? a.first_fire : null) + " -> " + JSON.stringify(b ? b.first_fire : null)); }
                }
                console.log(changed === 0 ? "No first-fire index changes vs " + prev.omp_version + "." : changed + " first-fire index change(s) vs " + prev.omp_version + ".");
              '
            else
              echo "No prior first-fire baseline; this run establishes first-fire-$OMP_VERSION.json."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload first-fire artifact for this OMP
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: first-fire-${{ env.OMP_VERSION }}.json
          path: first-fire-${{ env.OMP_VERSION }}.json
          # The next OMP version's run diffs against this file (step "Download previous first-fire baseline"),
          # and OMP can go weeks between releases. 3 KB; keep it.
          retention-days: 90
      - name: Default-policy G4 run (reported separately, never gates)
        if: success()
        run: |
          set +e
          OMP_KIT_DEFAULT_TTSR=1 sh scripts/e2e-live.sh
          rc=$?
          {
            echo "## Default-policy G4 (OMP $OMP_VERSION)"
            echo "exit=$rc (report-only; the kit-policy G4 in the ladder above gates the job)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Open or update one issue for this OMP version
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="OMP ${OMP_VERSION:-unknown} breaks omp-kit main"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$title" --body "The scheduled compatibility run failed against OMP ${OMP_VERSION:-unknown}: $RUN_URL. It stays open until a run on this or a later OMP passes."
          fi
      - name: Close compatibility issues once a run passes
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list --state open --search "in:title \"breaks omp-kit main\"" --json number,title \
            --jq '.[] | select(.title | test("^OMP .* breaks omp-kit main$")) | .number' |
          while read -r number; do
            gh issue close "$number" --comment "Passing on OMP $OMP_VERSION: $RUN_URL"
          done
      - name: Remember that this OMP passed on this commit
        if: success()
        run: mkdir -p omp-latest-tested && echo "$OMP_VERSION ${{ github.sha }}" > omp-latest-tested/marker
      - if: success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: omp-latest-tested
          key: omp-latest-tested-${{ needs.gate.outputs.version }}-${{ github.sha }}
