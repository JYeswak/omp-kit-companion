name: CI

# Every push to main runs the fast required gate to completion, one run per commit, so
# every landed commit gets its own verdict. Pull requests run the same Linux suites
# and targeted macOS service contracts; on other refs a newer push cancels the older run.
# cli-contracts aggregates both under the stable required check name.
# Non-push workflows keep the full test matrix.
# The full native set (macOS, four archives, real-HOME journey, native certification) runs on release
# (workflow_call from release.yml), on OMP certification (workflow_call from omp-certify.yml) and daily.
# There is no manual dispatch: 99 manual full-native runs in Oct 1-4 were most of the macOS minutes;
# dispatch release.yml for an intentional full run.
# OMP tracks come only from scripts/omp-compat.json: `minimum` and `certified`. This workflow never asks npm
# for latest, so an OMP release cannot turn main red; omp-certify.yml moves `certified` through a PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_call:
    inputs:
      version:
        description: Candidate release version; no public release or latest is created
        type: string
        required: false
      source_sha:
        description: Full commit SHA to test instead of github.sha (omp-certify.yml passes its candidate commit)
        type: string
        required: false
      reuse_fast_ci:
        description: Reuse exact-SHA green main CI by skipping only Ubuntu CLI and ladder legs
        type: boolean
        required: false
        default: false
      defer_signed_consumers:
        description: Defer the public real-home journey to the post-sign signed-consumer job
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# The event name keeps the daily schedule (and a workflow_call caller's event) from queueing behind, or being
# cancelled by, the push run of the same main SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  resolve-omp-versions:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    # Measured 5 s on push run 39185830559 (checkout, jq and two npm view calls).
    timeout-minutes: 5
    outputs:
      minimum: ${{ steps.resolve.outputs.minimum }}
      certified: ${{ steps.resolve.outputs.certified }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      suites: ${{ steps.suites.outputs.suites }}
      core_shards: ${{ steps.suites.outputs.core_shards }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
      - name: Read minimum and certified OMP versions from scripts/omp-compat.json
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          package="@oh-my-pi/pi-coding-agent"
          minimum="$(jq -er '.minimum' scripts/omp-compat.json)"
          certified="$(jq -er '.certified' scripts/omp-compat.json)"
          for version in "$minimum" "$certified"; do
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "invalid OMP version in scripts/omp-compat.json: $version" >&2
              exit 1
            fi
            echo "Validating pinned OMP version $version is published"
            published="$(npm view "$package@$version" version)"
            [[ "$published" == "$version" ]] || { echo "$package@$version is not published" >&2; exit 1; }
          done
          if [[ "$(printf '%s\n%s\n' "$minimum" "$certified" | sort -V | head -n 1)" != "$minimum" ]]; then
            echo "certified OMP $certified is below minimum $minimum" >&2
            exit 1
          fi
          matrix="$(jq -cn --arg minimum "$minimum" --arg certified "$certified" '[{track:"minimum",version:$minimum},{track:"certified",version:$certified}]')"
          {
            printf 'minimum=%s\n' "$minimum"
            printf 'certified=%s\n' "$certified"
            printf 'matrix=%s\n' "$matrix"
          } >> "$GITHUB_OUTPUT"
      - name: Plan cli-contracts suite legs (core is sharded on push and pull_request only)
        id: suites
        shell: bash
        env:
          # Push and PR run Ubuntu only, where four core shards cut the 12.0 min p50 critical path. Schedule and
          # workflow_call keep one core leg per OS: sharding there would multiply macOS jobs against the
          # five-slot macOS pool (tests/cli/ci-concurrency.test.sh).
          SHARDED: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && !inputs.reuse_fast_ci }}
        run: |
          set -euo pipefail
          shards=1
          if [[ "$SHARDED" == "true" ]]; then shards=4; fi
          suites="$(jq -cn --argjson n "$shards" '(if $n > 1 then [range(1; $n + 1) | "core-\(.)"] else ["core"] end) + ["package-release", "kit-update"]')"
          {
            printf 'core_shards=%s\n' "$shards"
            printf 'suites=%s\n' "$suites"
          } >> "$GITHUB_OUTPUT"
          echo "cli-contracts suite legs: $suites"
  stock-extensions:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Prove stock PATH and run every portable extension contract
        run: bun scripts/test-stock-extensions.ts
  mac-service-contracts:
    if: github.event.repository.private == false && (github.event_name == 'push' || github.event_name == 'pull_request')
    needs: resolve-omp-versions
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Install the certified OMP for service receipt contracts
        env:
          OMP_VERSION: ${{ needs.resolve-omp-versions.outputs.certified }}
        run: npm install --global "@oh-my-pi/pi-coding-agent@${OMP_VERSION}"
      - name: Generate the source manifest and fixture parent
        run: |
          mkdir -p var/agent-tmp
          sh scripts/build-manifest.sh
      - name: Verify macOS service execution, receipts, notifications and admission
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun test --timeout 120000 ./tests/cli/service.test.ts
  cli-contracts-suites:
    if: github.event.repository.private == false
    needs: resolve-omp-versions
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.reuse_fast_ci && fromJSON('["macos-15"]') || ((github.event_name == 'push' || github.event_name == 'pull_request') && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "macos-15"]')) }}
        suite: ${{ fromJSON(needs.resolve-omp-versions.outputs.suites) }}
    runs-on: ${{ matrix.os }}
    # Every event runs the same groups: CLI/fleet core, package release, and kit update.
    # Native br extension contracts run in the tool-equipped core fleet suite; portable extension
    # contracts run separately with no fleet tools on PATH. The former macOS 'all' job took
    # 39.2 min (test step 37.8) against this
    # 40 min cap (run 39073904994); the 25m41s the cap was first sized from was cut short by the older
    # 30 min cancellation. Ubuntu groups take 7.9-10.8 min (13 push runs). macOS groups are not yet
    # measured, so no speedup is claimed. Every check still runs; the cap is unchanged.
    # On push and pull_request the core group runs as core-1..core-N (`bun test --shard`, balanced by the
    # per-file durations in .github/core-test-timings.json, measured on push run 39185830559: 172 files,
    # 562 s serial, largest file 107 s). Steps that run once per core group run on core-1 (or core); the
    # cli-contracts summary proves the shards together ran every core test file exactly once.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: ${{ github.event_name == 'push' && (matrix.suite == 'core' || matrix.suite == 'core-1') && '0' || '1' }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Validate all unreleased source notes before main can become green
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (matrix.suite == 'core' || matrix.suite == 'core-1')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_tag="$(python3 scripts/release_reuse.py notes-floor --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA")"
          sh scripts/release-notes.sh check --base-tag "$base_tag" --head "$GITHUB_SHA"
      - name: Install bubblewrap for Linux integration containment
        if: runner.os == 'Linux' && (startsWith(matrix.suite, 'core') || matrix.suite == 'package-release')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 AppArmor denied bwrap's user namespace with EPERM on run 39040382320.
          # This is a runtime-only change on the ephemeral runner; containment stays enabled.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version
          smoke="$RUNNER_TEMP/bwrap-containment"
          mkdir -p "$smoke"
          bwrap --ro-bind / / --bind "$smoke" "$smoke" --proc /proc --dev /dev --share-net --die-with-parent -- /usr/bin/true
      - name: Install certified OMP and TypeScript LSP for CLI contracts
        env:
          OMP_VERSION: ${{ needs.resolve-omp-versions.outputs.certified }}
        run: npm install --global "@oh-my-pi/pi-coding-agent@${OMP_VERSION}" typescript-language-server@5.1.3 typescript@5.9.3
      - name: Install pinned br for policy-gate tests
        run: |
          set -euo pipefail
          case "${{ runner.os }}/${{ runner.arch }}" in
            Linux/X64) asset="linux_amd64" ;;
            macOS/ARM64) asset="darwin_arm64" ;;
            *) echo "unsupported runner for pinned br" >&2; exit 1 ;;
          esac
          ver="0.7.4"
          dir="$RUNNER_TEMP/br-bin"
          mkdir -p "$dir"
          base="br-${ver}-${asset}.tar.gz"
          url="https://github.com/Dicklesworthstone/beads_rust/releases/download/v${ver}/$base"
          curl -fsSL -o "$dir/$base" "$url"
          want=$(curl -fsSL "$url.sha256" | awk '{print $1}')
          got=$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$dir/$base")
          [ "$want" = "$got" ] || { echo "br sha256 mismatch" >&2; exit 1; }
          tar -xzf "$dir/$base" -C "$dir"
          bin=$(find "$dir" -name br -type f | head -n 1)
          [ -n "$bin" ] || { echo "br binary missing in $base" >&2; exit 1; }
          chmod +x "$bin"
          printf '%s\n' "$(dirname "$bin")" >> "$GITHUB_PATH"
          "$bin" --version
      - name: Generate ignored source manifest for CLI contracts
        run: sh scripts/build-manifest.sh
      - name: Exercise real Git import and hook installer contracts
        if: matrix.suite == 'core' || matrix.suite == 'core-1'
        env:
          TMPDIR: ${{ github.workspace }}/var/agent-tmp
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          sh tests/cli/commit-imports.test.sh
          sh tests/cli/check-staged-imports.test.sh
          sh tests/cli/install-commit-msg-bead.test.sh
      - name: Fetch reviewed OMP memory source fixture (18.4.9)
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/omp-reviewed"
          mkdir -p "$source_dir"
          npm pack --quiet --ignore-scripts --pack-destination "$source_dir" "@oh-my-pi/pi-coding-agent@18.4.9"
          tar -xzf "$source_dir/oh-my-pi-pi-coding-agent-18.4.9.tgz" -C "$source_dir" \
            package/package.json package/dist/cli.js \
            package/src/memory-backend/redact.ts \
            package/src/memory-backend/settings.ts \
            package/src/memory-backend/resolve.ts \
            package/src/config/settings.ts
      - name: Exercise the core CLI and native matcher contracts
        if: startsWith(matrix.suite, 'core')
        env:
          OMP_MEMORY_SOURCE_PATH: ${{ runner.temp }}/omp-reviewed/package/dist/cli.js
          SUITE: ${{ matrix.suite }}
          CORE_SHARDS: ${{ needs.resolve-omp-versions.outputs.core_shards }}
        # Keep the paths and ignore globs in sync with the shard coverage check in the cli-contracts job.
        run: |
          set -eu
          if [ "$SUITE" = core ]; then
            bun test tests/cli tests/fleet-guard --path-ignore-patterns='**/package-release.test.ts' --path-ignore-patterns='**/kit-update.test.ts'
          else
            shard="${SUITE#core-}"
            mkdir -p "$RUNNER_TEMP/core-shard"
            bun test tests/cli tests/fleet-guard --path-ignore-patterns='**/package-release.test.ts' --path-ignore-patterns='**/kit-update.test.ts' \
              --shard="$shard/$CORE_SHARDS" --timings=.github/core-test-timings.json \
              --reporter=junit --reporter-outfile="$RUNNER_TEMP/core-shard/junit-$shard.attempt-$GITHUB_RUN_ATTEMPT.xml"
          fi
      - name: Retain this core shard's file list for the coverage check
        if: always() && startsWith(matrix.suite, 'core-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-shard-junit-${{ matrix.suite }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-shard/
          if-no-files-found: warn
          retention-days: 2
      - name: Exercise package release contracts
        if: matrix.suite == 'package-release'
        env:
          OMP_MEMORY_SOURCE_PATH: ${{ runner.temp }}/omp-reviewed/package/dist/cli.js
        run: bun test ./tests/cli/package-release.test.ts
      - name: Exercise kit update contracts
        if: matrix.suite == 'kit-update'
        env:
          OMP_MEMORY_SOURCE_PATH: ${{ runner.temp }}/omp-reviewed/package/dist/cli.js
        run: bun test ./tests/cli/kit-update.test.ts
      - name: Exercise memory readiness against the installed certified OMP source
        if: matrix.suite == 'core' || matrix.suite == 'core-1'
        run: bun test tests/cli/memory-readiness.test.ts
      - name: Validate minimum/certified detached native receipts
        if: matrix.suite == 'core' || matrix.suite == 'core-1'
        run: python3 tests/cli/native_candidate_test.py
      - name: Test exact-SHA release reuse validation
        if: matrix.suite == 'core' || matrix.suite == 'core-1'
        run: python3 tests/scripts/release_reuse_test.py
      - name: Test the core shard coverage check against real bun shards
        if: matrix.suite == 'core' || matrix.suite == 'core-1'
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/scripts/ci_shard_coverage_test.py
      - name: Check README currency (every command and doctor scope documented, no pinned release version)
        if: matrix.suite == 'core' || matrix.suite == 'core-1'
        run: bun scripts/readme-check.ts
      - name: Exercise the release train, release-bump and doc-drift contracts
        if: matrix.suite == 'core' || matrix.suite == 'core-1'
        run: |
          mkdir -p var/agent-tmp
          sh tests/cli/release-train.test.sh
          sh tests/cli/doc-drift.test.sh
      - name: Run differential native-vs-kit oracle
        if: runner.os == 'Linux' && (matrix.suite == 'core' || matrix.suite == 'core-1')
        run: bun scripts/differential-oracle.ts
      - name: Verify differential oracle rejects a planted mismatch
        if: runner.os == 'Linux' && (matrix.suite == 'core' || matrix.suite == 'core-1')
        shell: bash
        run: |
          set -euo pipefail
          planted="$RUNNER_TEMP/differential-mismatch.tsv"
          cp cases/cases.tsv "$planted"
          python3 - "$planted" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          rows = path.read_text().splitlines()
          for index in range(1, len(rows)):
              fields = rows[index].split("\t")
              if len(fields) >= 6:
                  fields[1] = "quiet" if fields[1] == "fire" else "fire"
                  rows[index] = "\t".join(fields)
                  break
          else:
              raise SystemExit("no case row available for planted mismatch")
          path.write_text("\n".join(rows) + "\n")
          PY
          if bun scripts/differential-oracle.ts "$planted"; then
              echo "differential oracle accepted planted mismatch" >&2
              exit 1
          fi
  cli-contracts:
    name: cli-contracts (${{ matrix.os }})
    if: ${{ always() && github.event.repository.private == false && needs.resolve-omp-versions.result == 'success' }}
    needs: [resolve-omp-versions, stock-extensions, cli-contracts-suites, mac-service-contracts]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.reuse_fast_ci && fromJSON('["macos-15"]') || ((github.event_name == 'push' || github.event_name == 'pull_request') && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "macos-15"]')) }}
    runs-on: ${{ matrix.os }}
    # Result gate plus the shard coverage check (checkout, artifact download, one python run).
    timeout-minutes: 5
    steps:
      - name: Require all CLI contract suites to pass
        env:
          SUITES_RESULT: ${{ needs.cli-contracts-suites.result }}
          STOCK_EXTENSIONS_RESULT: ${{ needs.stock-extensions.result }}
          MAC_SERVICE_REQUIRED: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
          MAC_SERVICE_RESULT: ${{ needs.mac-service-contracts.result }}
        run: |
          set -euo pipefail
          if [[ "$STOCK_EXTENSIONS_RESULT" != "success" ]]; then
            echo "Stock extension contracts result: $STOCK_EXTENSIONS_RESULT" >&2
            exit 1
          fi
          if [[ "$SUITES_RESULT" != "success" ]]; then
            echo "CLI contract suites result: $SUITES_RESULT" >&2
            exit 1
          fi
          if [[ "$MAC_SERVICE_REQUIRED" == "true" && "$MAC_SERVICE_RESULT" != "success" ]]; then
            echo "macOS service contracts result: $MAC_SERVICE_RESULT" >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: needs.resolve-omp-versions.outputs.core_shards != '1'
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.resolve-omp-versions.outputs.core_shards != '1'
        with:
          pattern: core-shard-junit-*
          merge-multiple: true
          path: ${{ runner.temp }}/core-shard
      - name: Require the core shards together to run every core test file exactly once
        if: needs.resolve-omp-versions.outputs.core_shards != '1'
        env:
          CORE_SHARDS: ${{ needs.resolve-omp-versions.outputs.core_shards }}
        run: |
          python3 scripts/ci-shard-coverage.py --shards "$CORE_SHARDS" --junit-dir "$RUNNER_TEMP/core-shard" \
            --root tests/cli --root tests/fleet-guard \
            --ignore '**/package-release.test.ts' --ignore '**/kit-update.test.ts'
  ladder:
    if: github.event.repository.private == false
    needs: resolve-omp-versions
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.reuse_fast_ci && fromJSON('["macos-latest"]') || ((github.event_name == 'push' || github.event_name == 'pull_request') && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]')) }}
        omp: ${{ fromJSON(needs.resolve-omp-versions.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install regexploit and its JavaScript parser
        env:
          TMPDIR: ${{ runner.temp }}
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/regexploit-venv"
          python3.11 -m venv "$venv"
          "$venv/bin/python" -m pip install --no-cache-dir "regexploit==1.0.0"
          parser_dir="$("$venv/bin/python" -c 'import pathlib, regexploit.bin.regexploit_js as module; print(pathlib.Path(module.__file__).with_name("javascript"))')"
          npm --prefix "$parser_dir" ci --omit=dev --no-audit --no-fund
          npm --prefix "$parser_dir" install --no-save --package-lock=false --no-audit --no-fund '@typescript-eslint/parser@4.33.0' 'typescript@4.9.5'
          echo "$venv/bin" >> "$GITHUB_PATH"
          "$venv/bin/regexploit-js" --help >/dev/null
      - name: Enforce ReDoS checks on changed sources and run the planted negative
        env:
          # A PR is judged against its base, covering every change in the PR. github.event.before
          # names only the previous head, which a force-push makes unfetchable ("bad object").
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ inputs.source_sha || github.sha }}
          TMPDIR: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA:-}" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            python3.11 scripts/regexploit-gate.py --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            python3.11 scripts/regexploit-gate.py --head "$HEAD_SHA"
          fi
          python3.11 tests/scripts/regexploit-gate_test.py
      - name: Lint shell and workflow
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh checkers/*.sh installer/install.sh tests/cli/installer.test.sh tests/cli/install-verify.test.sh tests/e2e/real-home-journey.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color=false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install stock OMP for the ${{ matrix.omp.track }} ladder
        env:
          OMP_VERSION: ${{ matrix.omp.version }}
        run: npm install --global "@oh-my-pi/pi-coding-agent@${OMP_VERSION}"
      - name: Prove no fleet disk observer is installed (stock runner)
        run: if command -v sbh; then exit 1; fi
      - name: Plant a strict sbh observer on the stock runner (heavy must refuse with 69, auto must run)
        run: |
          set -eu
          plant="$RUNNER_TEMP/heavy-plant"
          mkdir -p "$plant/strict/config/omp-kit" "$plant/strict/state" "$plant/auto/config/omp-kit" "$plant/auto/state"
          printf '{"slots":2,"max_wait_s":60,"disk_observer":"sbh"}\n' > "$plant/strict/config/omp-kit/load.json"
          printf '{"slots":2,"max_wait_s":60,"disk_observer":"auto"}\n' > "$plant/auto/config/omp-kit/load.json"
          rc=0
          XDG_CONFIG_HOME="$plant/strict/config" XDG_STATE_HOME="$plant/strict/state" \
            bun run --no-env-file --config=/dev/null src/cli.ts heavy --label planted-strict-sbh -- sh -c 'echo ran' \
            > "$plant/strict.out" 2> "$plant/strict.err" || rc=$?
          if [ "$rc" -ne 69 ]; then echo "planted strict sbh exited $rc, expected 69" >&2; cat "$plant/strict.err" >&2; exit 1; fi
          grep -q 'no command was run' "$plant/strict.err"
          if [ -s "$plant/strict.out" ]; then echo "planted strict sbh still ran the command" >&2; exit 1; fi
          XDG_CONFIG_HOME="$plant/auto/config" XDG_STATE_HOME="$plant/auto/state" \
            bun run --no-env-file --config=/dev/null src/cli.ts heavy --label stock-auto -- sh -c 'echo ran' > "$plant/auto.out"
          test "$(cat "$plant/auto.out")" = ran
      - name: Check manifest and rule behavior
        run: sh scripts/ladder.sh
      - name: Check versioned installer against native archive
        env:
          TMPDIR: ${{ runner.temp }}
        run: sh tests/cli/installer.test.sh
      - name: Check installer attestation refusal against native archive
        env:
          TMPDIR: ${{ runner.temp }}
        run: sh tests/cli/install-verify.test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: ladder-reports-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 2

  build-candidates:
    needs: resolve-omp-versions
    if: github.event.repository.private == false && github.event_name != 'pull_request' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [darwin-arm64-none, darwin-x64-none, linux-arm64-gnu, linux-x64-gnu]
    env:
      CANDIDATE_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}.{1}', github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install the minimum OMP (package-time manifest classification parses rules with OMP)
        env:
          OMP_VERSION: ${{ needs.resolve-omp-versions.outputs.minimum }}
        run: npm install --global "@oh-my-pi/pi-coding-agent@${OMP_VERSION}"
      - name: Compile one provisional target and record its immutable archive hash
        env:
          TARGET: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidate/$TARGET"
          sh scripts/package-release.sh --version "$CANDIDATE_VERSION" --platform "$TARGET" \
            --out "$RUNNER_TEMP/candidate/$TARGET" > "$RUNNER_TEMP/candidate/$TARGET/asset.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: ${{ inputs.version && 7 || 2 }}

  real-home-journey:
    if: github.event.repository.private == false && github.event_name != 'push' && !inputs.defer_signed_consumers
    needs: [build-candidates, resolve-omp-versions]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64-none, runner: macos-15 }
          - { platform: linux-x64-gnu, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CANDIDATE_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}.{1}', github.run_id, github.run_attempt) }}
      # Same source, lower version: the installed "previous" kit that update --apply moves to the candidate.
      PREVIOUS_VERSION: 0.0.0-ci.0
      TARGET: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install certified OMP and TypeScript LSP for the journey
        env:
          OMP_VERSION: ${{ needs.resolve-omp-versions.outputs.certified }}
        run: npm install --global "@oh-my-pi/pi-coding-agent@${OMP_VERSION}" typescript-language-server@5.1.3 typescript@5.9.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/journey/candidate
      - name: Build the previous archive and both release indexes
        run: |
          J="$RUNNER_TEMP/journey"
          mkdir -p "$J/previous"
          sh scripts/package-release.sh --version "$PREVIOUS_VERSION" --platform "$TARGET" \
            --out "$J/previous" > "$J/previous/asset.json"
          for side in previous candidate; do
            if [ "$side" = previous ]; then v=$PREVIOUS_VERSION; else v=$CANDIDATE_VERSION; fi
            jq -c --arg v "$v" --arg k "$TARGET" \
              '{schema_version: 1, version: $v, source_tag: ("v" + $v), assets: {($k): .}}' \
              "$J/$side/asset.json" > "$J/$side/release-index.json"
          done
      - name: Run the real-HOME journey (previous -> candidate)
        run: |
          J="$RUNNER_TEMP/journey"
          sh tests/e2e/real-home-journey.sh \
            --previous-archive "$J/previous/$(jq -r .filename "$J/previous/asset.json")" \
            --previous-index "$J/previous/release-index.json" \
            --candidate-archive "$J/candidate/$(jq -r .filename "$J/candidate/asset.json")" \
            --candidate-index "$J/candidate/release-index.json" \
            --work-dir "$J/run"
      - name: Preserve the step log and every step's stdout/stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-home-journey-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/journey/run/log/
          if-no-files-found: warn
          retention-days: 2

  native-certification:
    if: github.event.repository.private == false && github.event_name != 'push'
    needs: [build-candidates, resolve-omp-versions]
    # Intel macOS is a non-shipping probe; release aggregation ignores it and requires all three ship targets.
    # For release runs, certify only shipping targets: macOS has five concurrent slots, and queued Intel
    # probes previously held the candidate. Daily and omp-certify runs keep the Intel probe in this matrix.
    continue-on-error: true
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.version != '' && '["darwin-arm64-none","linux-arm64-gnu","linux-x64-gnu"]' || '["darwin-arm64-none","darwin-x64-none","linux-arm64-gnu","linux-x64-gnu"]') }}
        omp: ${{ fromJSON(needs.resolve-omp-versions.outputs.matrix) }}
    runs-on: ${{ fromJSON('{"darwin-arm64-none":"macos-15","darwin-x64-none":"macos-15-intel","linux-arm64-gnu":"ubuntu-24.04-arm","linux-x64-gnu":"ubuntu-24.04"}')[matrix.platform] }}
    env:
      CANDIDATE_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}.{1}', github.run_id, github.run_attempt) }}
      OMP_VERSION: ${{ matrix.omp.version }}
      OMP_TRACK: ${{ matrix.omp.track }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install OMP ${{ matrix.omp.track }} for native behavior
        run: npm install --global "@oh-my-pi/pi-coding-agent@${OMP_VERSION}"
      - name: Install pinned TypeScript LSP for native route proof
        run: npm install --global typescript-language-server@5.1.3 typescript@5.9.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native/${{ matrix.platform }}
      - name: Prove native refusal console with an owned stage exiting 1
        env:
          TARGET: ${{ matrix.platform }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          OMP_KIT_NATIVE_FAILURE_ARCHIVE_DIR: ${{ runner.temp }}/native/${{ matrix.platform }}
          OMP_KIT_NATIVE_FAILURE_RECEIPT_OUT: ${{ runner.temp }}/native-refusal/receipt.json
        run: python3 tests/cli/native_candidate_test.py --native-failure-log
      - name: Certify downloaded archive on OMP ${{ matrix.omp.track }}
        env:
          TARGET: ${{ matrix.platform }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          python3 scripts/native-candidate.py native --version "$CANDIDATE_VERSION" \
            --platform "$TARGET" --source-sha "$SOURCE_SHA" \
            --omp-version "$OMP_VERSION" --omp-track "$OMP_TRACK" \
            --asset "$RUNNER_TEMP/native/$TARGET/asset.json" \
            --archive-dir "$RUNNER_TEMP/native/$TARGET" \
            --out "$RUNNER_TEMP/native-receipt/receipt.json"
      - name: Retain the actual certified-track shipping refusal for the aggregation control
        if: ${{ always() && inputs.version != '' && matrix.platform == 'linux-x64-gnu' && matrix.omp.track == 'certified' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-ship-refusal-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-refusal/receipt.json
          if-no-files-found: error
          retention-days: ${{ inputs.version && 7 || 2 }}
      - name: Preserve only detached bounded proof, including refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-receipt-${{ matrix.platform }}-${{ matrix.omp.track }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-receipt/receipt.json
          if-no-files-found: warn
          retention-days: ${{ inputs.version && 7 || 2 }}

  candidate-index:
    needs: [build-candidates, native-certification, resolve-omp-versions]
    if: ${{ github.event.repository.private == false && always() && github.event_name != 'pull_request' && needs.build-candidates.result == 'success' && needs.resolve-omp-versions.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}.{1}', github.run_id, github.run_attempt) }}
      RELEASE_CANDIDATE: ${{ inputs.version != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: candidate-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidates
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-receipt-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts
      - name: Normalize current-attempt artifact containers
        shell: bash
        run: |
          set -euo pipefail
          # Native validation expects canonical directory basenames. Only
          # attempt-filtered immutable containers are admitted to those names.
          for root in "$RUNNER_TEMP/candidates" "$RUNNER_TEMP/receipts"; do
            for directory in "$root"/*"-attempt-$GITHUB_RUN_ATTEMPT"; do
              [[ -d "$directory" ]] || continue
              canonical="${directory%"-attempt-$GITHUB_RUN_ATTEMPT"}"
              [[ ! -e "$canonical" ]] || { echo "ambiguous native artifact directory: $canonical" >&2; exit 4; }
              mv -- "$directory" "$canonical"
            done
          done
      - name: Build the provisional index; release mode requires all ship targets
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          release_args=()
          if [[ "$RELEASE_CANDIDATE" == "true" ]]; then
            release_args+=(--release)
          fi
          python3 scripts/native-candidate.py candidate --version "$CANDIDATE_VERSION" \
            --source-sha "$SOURCE_SHA" --assets "$RUNNER_TEMP/candidates" \
            --receipts "$RUNNER_TEMP/receipts" \
            --out "$RUNNER_TEMP/candidate-index" "${release_args[@]}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ env.RELEASE_CANDIDATE == 'true' }}
        with:
          name: native-ship-refusal-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-ship-refusal
      - name: Prove a real shipping refusal blocks a separate index without changing passing receipts
        if: ${{ env.RELEASE_CANDIDATE == 'true' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          OMP_KIT_NATIVE_INDEX_DIR: ${{ runner.temp }}/candidate-index
          OMP_KIT_NATIVE_ASSETS_DIR: ${{ runner.temp }}/candidates
          OMP_KIT_NATIVE_RECEIPTS_DIR: ${{ runner.temp }}/receipts
          OMP_KIT_NATIVE_FAILURE_RECEIPT: ${{ runner.temp }}/native-ship-refusal/receipt.json
        run: python3 tests/cli/native_candidate_test.py --native-ship-failure-index
      - name: Retain private provisional index, never publish or update latest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unpublished-candidate-index-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-index/
          if-no-files-found: error
          retention-days: ${{ inputs.version && 7 || 2 }}
