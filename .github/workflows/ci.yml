name: CI

# Every push to main runs the fast Linux gate (CLI contracts, ladder); a newer push cancels the older run.
# The full native set (macOS, four archives, real-HOME journey, native certification) runs on release
# (workflow_call from release.yml), daily, or on demand.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Candidate release version; no public release or latest is created
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install pinned OMP and TypeScript LSP for CLI contracts
        run: npm install --global @oh-my-pi/pi-coding-agent@18.4.4 typescript-language-server@5.1.3 typescript@5.9.3
      - name: Exercise self-contained CLI and native matcher consumer contracts
        run: bun test tests/cli tests/fleet-guard

  ladder:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Lint shell and workflow
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh checkers/*.sh installer/install.sh tests/cli/installer.test.sh tests/e2e/real-home-journey.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color=false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install stock omp 18.4.0 for original ladder
        run: npm install --global @oh-my-pi/pi-coding-agent@18.4.0
      - name: Check manifest and rule behavior
        run: sh scripts/ladder.sh
      - name: Check versioned installer against native archive
        env:
          TMPDIR: ${{ runner.temp }}
        run: sh tests/cli/installer.test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: ladder-reports-${{ matrix.os }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  build-candidates:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [darwin-arm64-none, darwin-x64-none, linux-arm64-gnu, linux-x64-gnu]
    env:
      CANDIDATE_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}.{1}', github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Compile one provisional target and record its immutable archive hash
        env:
          TARGET: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidate/$TARGET"
          sh scripts/package-release.sh --version "$CANDIDATE_VERSION" --platform "$TARGET" \
            --out "$RUNNER_TEMP/candidate/$TARGET" > "$RUNNER_TEMP/candidate/$TARGET/asset.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.platform }}
          path: ${{ runner.temp }}/candidate/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7

  real-home-journey:
    needs: build-candidates
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64-none, runner: macos-15 }
          - { platform: linux-x64-gnu, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CANDIDATE_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}.{1}', github.run_id, github.run_attempt) }}
      # Same source, lower version: the installed "previous" kit that update --apply moves to the candidate.
      PREVIOUS_VERSION: 0.0.0-ci.0
      TARGET: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install pinned OMP and TypeScript LSP for the journey's test --full
        run: npm install --global @oh-my-pi/pi-coding-agent@18.4.4 typescript-language-server@5.1.3 typescript@5.9.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-${{ matrix.platform }}
          path: ${{ runner.temp }}/journey/candidate
      - name: Build the previous archive and both release indexes
        run: |
          J="$RUNNER_TEMP/journey"
          mkdir -p "$J/previous"
          sh scripts/package-release.sh --version "$PREVIOUS_VERSION" --platform "$TARGET" \
            --out "$J/previous" > "$J/previous/asset.json"
          for side in previous candidate; do
            if [ "$side" = previous ]; then v=$PREVIOUS_VERSION; else v=$CANDIDATE_VERSION; fi
            jq -c --arg v "$v" --arg k "$TARGET" \
              '{schema_version: 1, version: $v, source_tag: ("v" + $v), assets: {($k): .}}' \
              "$J/$side/asset.json" > "$J/$side/release-index.json"
          done
      - name: Run the real-HOME journey (previous -> candidate)
        run: |
          J="$RUNNER_TEMP/journey"
          sh tests/e2e/real-home-journey.sh \
            --previous-archive "$J/previous/$(jq -r .filename "$J/previous/asset.json")" \
            --previous-index "$J/previous/release-index.json" \
            --candidate-archive "$J/candidate/$(jq -r .filename "$J/candidate/asset.json")" \
            --candidate-index "$J/candidate/release-index.json" \
            --work-dir "$J/run"
      - name: Preserve the step log and every step's stdout/stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-home-journey-${{ matrix.platform }}
          path: ${{ runner.temp }}/journey/run/log/
          if-no-files-found: warn
          retention-days: 7

  native-certification:
    needs: build-candidates
    # One failing target is excluded; the aggregate still requires a nonempty native-certified set.
    continue-on-error: true
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64-none, runner: macos-15 }
          - { platform: darwin-x64-none, runner: macos-15-intel }
          - { platform: linux-arm64-gnu, runner: ubuntu-24.04-arm }
          - { platform: linux-x64-gnu, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    env:
      CANDIDATE_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}.{1}', github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install pinned stock OMP for native behavior
        run: npm install --global @oh-my-pi/pi-coding-agent@18.4.2
      - name: Install pinned TypeScript LSP for native route proof
        run: npm install --global typescript-language-server@5.1.3 typescript@5.9.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-${{ matrix.platform }}
          path: ${{ runner.temp }}/native/${{ matrix.platform }}
      - name: Certify the downloaded archive, never the source runner
        env:
          TARGET: ${{ matrix.platform }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/native-candidate.py native --version "$CANDIDATE_VERSION" \
            --platform "$TARGET" --source-sha "$SOURCE_SHA" \
            --asset "$RUNNER_TEMP/native/$TARGET/asset.json" \
            --archive-dir "$RUNNER_TEMP/native/$TARGET" \
            --out "$RUNNER_TEMP/native-receipt/receipt.json"
      - name: Preserve only detached bounded proof, including refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-receipt-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-receipt/receipt.json
          if-no-files-found: warn
          retention-days: 7

  candidate-index:
    needs: [build-candidates, native-certification]
    if: ${{ always() && github.event_name != 'push' && needs.build-candidates.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}.{1}', github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/candidates
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-receipt-*
          path: ${{ runner.temp }}/receipts
      - name: Exclude uncertified targets and require at least one real native result
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/native-candidate.py candidate --version "$CANDIDATE_VERSION" \
            --source-sha "$SOURCE_SHA" --assets "$RUNNER_TEMP/candidates" \
            --receipts "$RUNNER_TEMP/receipts" --out "$RUNNER_TEMP/candidate-index"
      - name: Retain private provisional index, never publish or update latest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unpublished-candidate-index
          path: ${{ runner.temp }}/candidate-index/
          if-no-files-found: error
          retention-days: 7
